<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学科対策">
<meta name="theme-color" content="#1f6feb">
<title>学科試験対策</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --text:#1b1f27; --sub:#6b7280; --line:#e3e7ee;
  --accent:#1f6feb; --ok:#14965a; --ng:#d6334a; --okbg:#e6f6ee; --ngbg:#fde9ec; --chip:#eef2f8; --warn:#c2410c; --trapbg:#fff4e5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e8ebf1; --sub:#9aa3b2; --line:#2a303b;
    --accent:#4c8dff; --ok:#3ccf8e; --ng:#ff6b7f; --okbg:#12301f; --ngbg:#3a1820; --chip:#222834; --warn:#fbbf24; --trapbg:#33270f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
h2{font-size:17px;margin:22px 0 6px}
.tag{font-size:12px;font-weight:600;background:var(--chip);color:var(--sub);border-radius:6px;padding:2px 8px;vertical-align:middle}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.center{text-align:center !important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;
  background:var(--accent);color:#fff;margin:8px 0;text-align:left;cursor:pointer;font-family:inherit}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.85}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
#timer.warn{color:var(--warn);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qcat{display:inline-block;font-size:12px;background:var(--chip);border-radius:6px;padding:2px 8px;color:var(--sub)}
.qtext{font-size:18px;margin:12px 0 4px;min-height:4.5em}
.sign{display:flex;justify-content:center;margin:12px 0 0}
.sign svg{width:auto;height:130px;max-width:85%}
.sign.small svg{height:70px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.ans{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;font-size:44px;font-weight:700;
  padding:18px 0;cursor:pointer;font-family:inherit}
.ans.o,.mini.o{color:var(--ok)} .ans.x,.mini.x{color:var(--ng)}
.ans.sel,.mini.sel{border-color:var(--accent);background:var(--chip)}
.scene{font-size:16px;margin:10px 0;padding:12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:8px}
.kk{border-top:1px solid var(--line);padding:12px 0}
.kkq{font-size:16px}
.kkbtn{display:flex;gap:10px;margin-top:8px}
.mini{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:26px;font-weight:700;padding:6px 0;cursor:pointer;font-family:inherit}
.kkfb{font-size:13px;margin-top:6px;padding:8px 10px;border-radius:8px}
.kkfb.ok,.feedback.ok{background:var(--okbg)} .kkfb.ng,.feedback.ng{background:var(--ngbg)}
.feedback{border-radius:12px;padding:12px 14px;margin-top:12px}
.feedback b{font-size:17px}
.feedback.ok b{color:var(--ok)} .feedback.ng b{color:var(--ng)}
.link{background:none;border:none;color:var(--accent);font-size:14px;padding:4px 0;cursor:pointer;font-family:inherit}
.big{font-size:44px;font-weight:800;margin:8px 0 0}
.pass{color:var(--ok)} .fail{color:var(--ng)}
.review{border-top:1px solid var(--line);padding:12px 0}
.review:first-child{border-top:none}
.review .mark{font-weight:700}
.kkrev{margin-top:8px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;
  background:var(--bg);color:var(--text);font-family:inherit}
.row{display:flex;gap:8px}
details summary{cursor:pointer;font-size:14px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.cell{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 0;font-size:13px;font-family:inherit}
.cell.filled{background:var(--chip);color:var(--sub)}
.cell.cur{border-color:var(--accent);border-width:2px;color:var(--text)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin:8px 0}
.seg button{border:none;background:transparent;color:var(--sub);border-radius:9px;padding:10px 6px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button small{display:block;font-size:11px;font-weight:400}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.small button{font-size:13px;padding:8px 4px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:6px 2px}
.toggle input{width:20px;height:20px}
.exp{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px}
.exp .lbl{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.exp.trap{background:var(--trapbg)}
.exp.trap .lbl{color:var(--warn)}
.rhead{margin-bottom:4px}
.memo table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.memo th{text-align:left;padding:8px 4px 4px;color:var(--accent);font-size:13px}
.memo td{padding:5px 4px;border-top:1px solid var(--line)}
.memo td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.memo ul{padding-left:20px;font-size:14px;margin:12px 0 0}
.memo li{margin:4px 0}
.qcat.hard{background:var(--trapbg);color:var(--warn);font-weight:700}
.toggle.strong{color:var(--text);font-weight:600;margin-top:12px}
.hardbtn{border:2px solid var(--warn)}
.kouka{border:2px solid var(--accent)}
.sign svg.wide{height:80px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.unsure{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:4px 12px;font-size:12px;font-family:inherit;cursor:pointer;flex-shrink:0}
.unsure.on{border-color:var(--warn);color:var(--warn);background:var(--trapbg);font-weight:700}
.tr{display:flex;align-items:center;gap:8px}
.spk{font-size:18px;padding:0 2px}
.mastery{margin:-4px 0 4px}
.mbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok)}
.review-btn{background:var(--ok)}
.exp.cmpmemo{background:var(--okbg)}
.exp.cmpmemo .lbl{color:var(--ok)}
.chips.cmp .chip{font-size:13px}
.flash .qcat{align-self:flex-start}
.voicebox summary{font-size:14px;color:var(--sub);cursor:pointer}
.vrow{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}
.vrow select{flex:1;font-size:15px;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.vrow input[type=range]{flex:1}
.topbar>.link{white-space:nowrap;flex-shrink:0}
.topbar>span:nth-child(2){flex:1;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr{flex-shrink:0;white-space:nowrap}
.flash{min-height:220px;cursor:pointer;display:flex;flex-direction:column;gap:12px}
.ffront{font-size:20px;font-weight:700;margin-top:8px}
.fback{font-size:24px;font-weight:800;color:var(--accent);border-top:1px dashed var(--line);padding-top:12px}.sign.small svg.wide{height:44px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.listen-btn{background:#3b3f8f}
.morning-btn{background:#d97706}
.listen .lcard{min-height:300px}
.lq{font-size:20px;line-height:1.7;margin:12px 0;opacity:.9}
.lq.small{font-size:16px}
.la{font-size:44px;font-weight:800;margin:6px 0}
.lexp{font-size:15px;color:var(--sub);margin-top:8px}
.lexp.trap{color:var(--warn)}
.lk{font-size:15px;margin:8px 0}
#dlStatus .mbar{margin-top:6px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
</head>

{c:"駐停車",a:false,q:"自分の家の車庫の出入口であれば、その前3メートル以内に駐車してもよい。",e:"自分の家の車庫でも、自動車用の出入口から3メートル以内は駐車禁止です。",t:"「自分の車庫」の例外はない。",h:1},
{c:"駐停車",a:false,q:"自転車横断帯の前後5メートル以内でも、原動機付自転車であれば駐車してよい。",e:"自転車横断帯とその前後5メートル以内は、車の種類に関係なく駐停車禁止です。",t:"車種で例外を作るひっかけ。"},
{c:"駐停車",a:true,q:"道路工事区域の端から5メートル以内は駐車禁止だが、停車は禁止されていない。",e:"駐車禁止場所なので、停車はできます。",t:"駐車禁止と駐停車禁止の場所を区別する。"},
{c:"駐停車",a:false,q:"歩行者の通行の妨げにならないよう、車輪を歩道に乗り上げて駐車するとよい。",e:"歩道に乗り上げて駐車してはいけません。",t:"もっともらしい理由づけのひっかけ。"},
{c:"駐停車",a:true,q:"道路の左端に平行に駐車している車と並んで、駐停車してはならない（二重駐車の禁止）。",e:"駐停車は道路の左端に沿って行います。",t:"「少しの間なら」は×。"},
{c:"駐停車",a:false,q:"歩道や路側帯のない道路で駐車するときは、歩行者のために道路の左端から0.75メートル以上あけなければならない。",e:"歩道や路側帯のない道路では、道路の左端に沿って駐車します。",t:"0.75mは路側帯の中に入って止めるときのルール。"},
{c:"駐停車",a:true,q:"時間制限駐車区間では、標識に示された時間を超えて駐車してはならない。",e:"パーキング・メーターなどを作動させ、表示された時間内に駐車します。",t:"時間内でも作動させずに駐車するのは×。"},
{c:"駐停車",a:true,q:"違法駐車の車に付けられた放置車両確認標章は、その車の運転者などが取り除くことができ、それ以外の者が取り除いてはならない。",e:"関係のない人が勝手に取り除くことは禁止されています。",t:"標章を取り除いても違反は消えない。"},
{c:"駐停車",a:true,q:"放置違反金の納付命令は、運転者が反則金を納めない場合などに、その車の使用者に対して出されることがある。",e:"使用者（所有者など）にも責任が問われます。",t:"「運転者だけの責任」は×。"},
{c:"駐停車",a:true,q:"違法駐車の車に取り付けられた車輪止め装置を、勝手に取り外したり壊したりしてはならない。",e:"警察署長などが取り外します。",t:"自分の車でも勝手に外せない。"},
{c:"駐停車",a:true,q:"違法駐車でレッカー移動された場合、その費用は運転者や使用者などが負担する。",e:"移動や保管にかかった費用を負担します。",t:"費用は違反した側の負担。"},
{c:"駐停車",a:true,q:"自動車の保管場所は、使用の本拠の位置から2キロメートル以内の、道路以外の場所に確保しなければならない。",e:"道路を保管場所として使ってはいけません。",t:"「2km以内」「道路以外」がポイント。"},
{c:"駐停車",a:false,q:"自動車の保管場所の証明は、最寄りの運転免許試験場に申請する。",e:"保管場所の証明は、保管場所を管轄する警察署長に申請します。",t:"試験場ではなく警察署。"},
// --- 運転者の義務・免許 ---
{c:"運転者の義務",a:true,q:"自動車を後退させるために運転するときは、シートベルトを着用しなくてもよい。",e:"後退時はシートベルトの着用義務が免除されています。",t:"着用義務の数少ない例外。",h:1},
{c:"運転者の義務",a:false,q:"シートベルトの腰ベルトは、腹部にかかるようにゆるめに締める。",e:"腰ベルトは骨盤（腰骨）の位置にかけ、しっかり締めます。",t:"「腹部」「ゆるめ」が両方とも誤り。"},
{c:"運転者の義務",a:true,q:"運転席は、ブレーキペダルやクラッチペダルを一杯に踏み込んだとき、ひざがわずかに曲がる位置に合わせる。",e:"背もたれは、ハンドルを両手で握ったときにひじがわずかに曲がる角度に合わせます。",t:"ひざも、ひじも「わずかに曲がる」。"},
{c:"運転者の義務",a:true,q:"運転免許の条件が「眼鏡等」の人は、コンタクトレンズを使用して運転してもよい。",e:"「眼鏡等」にはコンタクトレンズも含まれます。",t:"「等」に含まれる。"},
{c:"運転者の義務",a:true,q:"警察官から運転免許証の提示を求められたときは、提示しなければならない。",e:"運転するときは免許証を携帯し、求められたら提示します。",t:"当たり前の内容を×と疑わないこと。"},
{c:"運転者の義務",a:false,q:"普通免許を受けて1年未満の初心運転者は、高速道路を通行してはならない。",e:"初心運転者も高速道路を通行できます。初心運転者標識を付けて運転します。",t:"そういう禁止規定はない。"},
{c:"運転者の義務",a:false,q:"仮免許練習標識を付けていれば、仮免許を受けた人は一人で練習運転をしてもよい。",e:"仮免許で練習するときは、その車を運転できる免許を3年以上受けている人などを助手席に乗せます。",t:"標識だけでは足りない。"},
{c:"運転者の義務",a:false,q:"仮免許がなくても、運転免許を持っている人が助手席に乗っていれば、道路で運転の練習をしてもよい。",e:"道路で練習するには仮免許が必要です。",t:"無免許運転になる。"},
{c:"運転者の義務",a:false,q:"仮免許練習標識は、車の前部にだけ付ければよい。",e:"車の前と後ろの定められた位置に付けます。",t:"初心運転者標識も前後。"},
{c:"運転者の義務",a:false,q:"高齢運転者標識は、車の後ろにだけ付ければよい。",e:"車の前と後ろの定められた位置に付けます。",t:"マーク類は前後。"},
{c:"運転者の義務",a:false,q:"大型特殊免許を受けていれば、普通自動車も運転することができる。",e:"大型特殊免許で運転できるのは、大型特殊自動車・小型特殊自動車・原動機付自転車です。",t:"大型免許と取り違えないこと。"},
{c:"運転者の義務",a:false,q:"総排気量660cc以下の普通自動車であれば、大型特殊免許でも運転することができる。",e:"いわゆる軽自動車も普通自動車なので、普通免許以上が必要です。大型特殊免許では運転できません。",t:"「660cc以下」で特別扱いさせるひっかけ。",h:1},
{c:"運転者の義務",a:false,q:"小型特殊免許を受けていれば、原動機付自転車も運転することができる。",e:"小型特殊免許で運転できるのは小型特殊自動車だけです。",t:"他の免許は原付も運転できるが、小型特殊免許は例外。",h:1},
{c:"運転者の義務",a:true,q:"大型免許を受けていても、大型特殊自動車を運転することはできない。",e:"大型特殊自動車には大型特殊免許が必要です。",t:"「大型」が付いていても別の免許。"},
{c:"運転者の義務",a:false,q:"普通免許で、最大積載量2,000キログラムの貨物自動車を運転することができる。",e:"普通免許で運転できるのは、最大積載量2,000キログラム未満の自動車です（2017年3月12日以降に取得した場合）。",t:"「未満」なので2,000kgちょうどは×。",h:1},
{c:"運転者の義務",a:false,q:"他人の車を運転するときは、自動車検査証の有効期間や自賠責保険の加入を確かめる必要はない。",e:"運転する人は、他人の車でも確かめる必要があります。",t:"「他人の車だから」は理由にならない。"},
{c:"運転者の義務",a:false,q:"原動機付自転車は、自賠責保険（共済）に加入していなくても運転してよい。",e:"原動機付自転車も自賠責保険（共済）への加入が義務づけられています。",t:"原付も強制保険の対象。"},
{c:"運転者の義務",a:true,q:"任意保険（自動車保険）は、自賠責保険では足りない損害賠償に備えるために加入しておくとよい。",e:"自賠責保険は対人賠償のみで、上限もあります。",t:"任意保険は義務ではないが重要。"},
{c:"運転者の義務",a:true,q:"交通事故を起こした運転者は、刑事上の責任、行政上の責任、民事上の責任を負うことがある。",e:"罰金などの刑事責任、免許の停止などの行政責任、損害賠償の民事責任があります。",t:"3つの責任をセットで覚える。"},
{c:"運転者の義務",a:true,q:"車の鍵の管理が不十分で他人に持ち出され事故が起きた場合、車の所有者が責任を問われることがある。",e:"車と鍵は確実に管理します。",t:"「運転していないから無関係」は×。"},
{c:"運転者の義務",a:false,q:"発進や後退のとき、同乗者に安全確認を頼んでいれば、事故が起きても運転者に責任はない。",e:"安全確認の責任は運転者にあります。",t:"他人任せは×。"},
{c:"運転者の義務",a:true,q:"運転者に過積載となる運転を要求したり、過積載になると知りながら荷物を渡したりしてはならない。",e:"荷主なども過積載に関わってはいけません。",t:"運転者以外も処罰の対象。"},
{c:"運転者の義務",a:false,q:"前の晩に飲んだ酒が残っていても、眠気がなければ運転してよい。",e:"体内に酒が残っている状態での運転は酒気帯び運転になります。",t:"二日酔いも飲酒運転。"},
{c:"運転者の義務",a:false,q:"自宅の前の歩道であれば、植木鉢などを置いてもよい。",e:"道路に交通の妨げとなる物を置いてはいけません。",t:"「自宅の前」でも道路は道路。"},
{c:"運転者の義務",a:false,q:"人家のない道路であれば、走行中の車の窓から空き缶などを捨ててもよい。",e:"車から物を投げ捨ててはいけません。",t:"場所に関係なく禁止。"},
{c:"運転者の義務",a:true,q:"運転中は、窓枠にひじをのせたり、窓から手や顔を出したりしない。",e:"とっさのハンドル操作が遅れ、危険です。",t:"運転姿勢の基本。"},
{c:"運転者の義務",a:true,q:"フロントガラスやルームミラーにマスコットなどを付けると、視界や運転の妨げになる。",e:"視野を妨げるものは付けません。",t:"当たり前の内容を×と疑わないこと。"},
{c:"運転者の義務",a:false,q:"二輪車のナンバープレートは、番号が見えていれば折り曲げて取り付けてもよい。",e:"ナンバープレートを折り曲げたり、見えにくくしたりしてはいけません。",t:"「見えていれば」という条件づけのひっかけ。"},
{c:"運転者の義務",a:true,q:"二輪車のマフラーを取り外すなど、騒音を大きくする改造をしてはならず、改造した者も処罰の対象になる。",e:"マフラーの芯を抜くことなども禁止されています。",t:"「出力が上がるから」は理由にならない。"},
{c:"運転者の義務",a:true,q:"光化学スモッグが発生しているときは、車の運転をできるだけ控える。",e:"排出ガスが光化学スモッグの原因の一つです。",t:"交通公害を問う問題。"},
{c:"運転者の義務",a:true,q:"急発進・急加速・空ぶかしは、排出ガスや騒音などの交通公害の原因になる。",e:"燃料の無駄にもなります。",t:"「エンジンが温まる」などの理由づけは×。"},
// --- 危険・車の知識 ---
{c:"危険な場面・車の知識",a:true,q:"夕暮れは急に暗くなり、歩行者などが見えにくくなるので、早めに前照灯をつける。",e:"薄暮時は事故が多い時間帯です。",t:"「暗くなりきってから」は×。"},
{c:"危険な場面・車の知識",a:false,q:"街路灯が明るい夜間の市街地では、前照灯をつけずに運転してもよい。",e:"夜間は、街路灯が明るくても前照灯などの灯火をつけます。",t:"灯火は「見る」ためだけでなく「見せる」ため。"},
{c:"危険な場面・車の知識",a:true,q:"夜間に室内灯をつけたまま走ると、前方が見えにくくなる。",e:"室内灯は消して運転します。",t:"当たり前の内容を×と疑わないこと。"},
{c:"危険な場面・車の知識",a:true,q:"夜間は、視線をできるだけ先の方に向け、障害物などを早く発見するようにする。",e:"前照灯の照らす範囲より先にも注意を払います。",t:"一点を見つめるのは×。"},
{c:"危険な場面・車の知識",a:false,q:"運転中は、気が散らないよう前方の一点を見つめて運転するのがよい。",e:"一点だけを見つめず、周囲全体に目を配ります。",t:"初心者に多い誤り。"},
{c:"危険な場面・車の知識",a:false,q:"運転中にバックミラーを見ると前方への注意が散漫になるので、なるべく見ないほうがよい。",e:"ミラーで後方の状況を確かめることは安全運転に必要です。",t:"ミラー確認は必要。"},
{c:"危険な場面・車の知識",a:true,q:"明るいところから急に暗いところに入ると、一時的に視力が落ちる。",e:"トンネルに入る前などは速度を落とします。",t:"暗→明も同様に見えにくくなる。"},
{c:"危険な場面・車の知識",a:false,q:"前照灯をつけていれば、明るいところから暗いトンネルに入るときでも速度を落とす必要はない。",e:"目が慣れるまで見えにくいので、手前で速度を落とします。",t:"前照灯は目の慣れを補えない。"},
{c:"危険な場面・車の知識",a:true,q:"霧が出たときは、前照灯などを早めにつけ、必要に応じて警音器を使う。",e:"前照灯は下向きにします。",t:"上向きは乱反射して見えにくい。"},
{c:"危険な場面・車の知識",a:false,q:"霧で視界が悪いときは、道路の中央線を目安にして、その上を走るとよい。",e:"道路の中央線や車のライトを目安に、左側の通行帯を速度を落として走ります。中央線の上を走ると対向車と衝突するおそれがあります。",t:"「目安にする」と「上を走る」は別。"},
{c:"危険な場面・車の知識",a:true,q:"高速道路のトンネルの出口や橋の上などでは、横風を受けやすいので注意する。",e:"ハンドルをしっかり握り、速度を落とします。",t:"横風の吹きやすい場所を問う問題。"},
{c:"危険な場面・車の知識",a:false,q:"横風が強いときは、大型車の後ろにぴったりついて走ると、風を受けずに安全である。",e:"車間距離が短くなり危険です。十分な車間距離をとります。",t:"もっともらしい理由づけのひっかけ。"},
{c:"危険な場面・車の知識",a:true,q:"後輪が横滑りしたときは、アクセルを緩め、後輪が滑った方向にハンドルを切って車の向きを立て直す。",e:"急ブレーキはかけません。",t:"「逆方向に切る」は×。",h:1},
{c:"危険な場面・車の知識",a:false,q:"雨の日に工事現場の鉄板の上でブレーキをかけるときは、急ブレーキのほうが早く止まれて安全である。",e:"鉄板の上は滑りやすいので、手前で速度を落とし、鉄板の上での急ブレーキは避けます。",t:"滑りやすい場所での急操作は×。"},
{c:"危険な場面・車の知識",a:false,q:"凍結のおそれがあるときでも、道路が汚れていれば水をまいて掃除してよい。",e:"凍結のおそれがあるときに、道路に水をまいてはいけません。",t:"「掃除のため」は理由にならない。"},
{c:"危険な場面・車の知識",a:true,q:"雪道の下り坂では、エンジンブレーキを使い、フットブレーキは数回に分けて軽く踏む。",e:"急ブレーキはスリップの原因になります。",t:"雪道でも「エンジンブレーキ＋小刻みなブレーキ」。"},
{c:"危険な場面・車の知識",a:false,q:"雪道用のタイヤやチェーンを付けていれば、凍った道路でも乾いた道路と同じように運転してよい。",e:"滑り止めを付けていても滑ることがあるので、速度を落として慎重に運転します。",t:"「付けていれば大丈夫」は×。"},
{c:"危険な場面・車の知識",a:true,q:"タイヤチェーンを付けたら、しばらく走ってから締め直す。",e:"走るとチェーンが緩むことがあります。",t:"装着後の点検を問う問題。"},
{c:"危険な場面・車の知識",a:false,q:"ぬかるみなどでタイヤが空回りしたときは、ローギアで一気に加速すると脱出しやすい。",e:"急に加速すると、さらに空回りして深くはまります。古毛布や砂利などを敷いて静かに発進します。",t:"「一気に」は×。"},
{c:"危険な場面・車の知識",a:false,q:"上り坂では、こう配に関係なく、ローギアで走らなければならない。",e:"こう配に合ったギアを選びます。",t:"「関係なく」がひっかけ。"},
{c:"危険な場面・車の知識",a:false,q:"長い下り坂でブレーキが効かなくなったときは、ギアをニュートラルにするとよい。",e:"ニュートラルにするとエンジンブレーキも効かなくなります。減速チェンジとハンドブレーキで速度を落とします。",t:"N（ニュートラル）は×の定番。"},
{c:"危険な場面・車の知識",a:true,q:"対向車と正面衝突しそうになったときは、警音器とブレーキを使い、できる限り左によけ、道路外が安全な場所であれば道路外に出ることもためらわない。",e:"最悪の場合でも、正面衝突だけは避けるようにします。",t:"緊急時の回避方法を問う問題。"},
{c:"危険な場面・車の知識",a:false,q:"走行中にエンジンの回転数が下がらなくなったときは、半クラッチにして走り続けるとよい。",e:"ギアをニュートラルにして車輪にエンジンの力が伝わらないようにし、ブレーキで速度を落として道路の左端に止め、エンジンを止めます。",t:"半クラッチで走り続けるのは×。"},
{c:"危険な場面・車の知識",a:true,q:"走行中にエンジンの回転数が上がったまま下がらなくなったときは、ギアをニュートラルにしてブレーキで速度を落とす。",e:"道路の左端に止めてエンジンを止めます。",t:"このときだけはNが○。下り坂のNと区別する。",h:1},

{c:"自転車・二輪",a:true,q:"自転車も車両の一種なので、原則として車道の左側を通行しなければならない。",e:"自転車は軽車両で、車道の左側通行が原則です。",t:"「自転車は歩道」と思わせる。"},
{c:"自転車・二輪",a:false,q:"自転車の酒気帯び運転は、罰則の対象にはならない。",e:"2024年11月から、自転車の酒気帯び運転にも罰則があります。",t:"「自転車だから大丈夫」は×。"},
{c:"自転車・二輪",a:true,q:"自転車を運転しながらスマートフォンを手に持って通話したり、画面をじっと見たりすることは禁止されている。",e:"いわゆる「ながらスマホ」は罰則の対象です。",t:"車と同じく禁止。"},
{c:"自転車・二輪",a:false,q:"普通自転車は、道路のどこでも2台まで並んで通行してよい。",e:"並んで通行できるのは、「並進可」の標識がある場所だけです。",t:"「2台まで」と具体的にして正しく見せている。"},
{c:"踏切・坂道",a:true,q:"踏切内で車が動かなくなり、近くに非常ボタンがないときは、発炎筒などを使って列車に合図する。",e:"発炎筒がなければ、煙の出やすいものを燃やすなどの方法もあります。",t:"非常ボタンがないときの方法。"},
{c:"踏切・坂道",a:false,q:"信号機のある踏切では、青信号であっても一時停止しなければならない。",e:"青信号のときは、一時停止せずに安全を確かめて通過できます。",t:"踏切は「必ず一時停止」と思わせる。"},
{c:"踏切・坂道",a:true,q:"坂道で行き違うとき、近くに待避所があれば、上りか下りかに関係なく、待避所のある側の車がそこに入って道を譲る。",e:"待避所がない場合は、下りの車が道を譲るのが原則です。",t:"「上り優先」だけを覚えていると迷う。"},
{c:"高速道路",a:false,q:"高速道路の本線車道で出口を通り過ぎてしまったときは、路肩に止めて後退すればよい。",e:"本線車道では後退・転回・横断が禁止されています。次の出口で出ます。",t:"「少しだけなら」は通用しない。"},
{c:"高速道路",a:true,q:"高速道路で故障などのため止まったときは、同乗者もガードレールの外側など安全な場所に避難させる。",e:"車内や車のそばにいると、後続車に追突されるおそれがあります。",t:"運転者だけでなく同乗者も。"},
{c:"高速道路",a:false,q:"普通自動車が高速自動車国道の本線車道を通行するとき、最高速度の標識がなければ時速120キロメートルまで出すことができる。",e:"法定最高速度は時速100キロメートルです。120キロメートルは標識で指定された区間だけです。",t:"一部区間の最高速度を一般化させている。"},
{c:"運転者の義務",a:false,q:"初心運転者期間中に違反点数の合計が3点以上になると、ただちに再試験を受けなければならない。",e:"まず初心運転者講習を受けます（1回の違反で3点の場合は4点以上が対象）。講習を受けなかったときや、講習後にまた違反したときに再試験になります。",t:"講習と再試験の順番の入れ替え。"},
{c:"運転者の義務",a:false,q:"任意保険に入っていれば、自賠責保険（共済）に入っていなくても車を運転してよい。",e:"自賠責保険（共済）は法律で加入が義務づけられています。",t:"任意保険で代わりにはならない。"},
{c:"運転者の義務",a:true,q:"運転免許証を家に置いたまま車を運転すると、免許証不携帯の違反になる。",e:"免許を受けていても、運転中は免許証を携帯しなければなりません。",t:"無免許とは別の違反。"},
{c:"運転者の義務",a:false,q:"免許証の有効期間が過ぎても、1か月以内であれば運転してよい。",e:"有効期間が過ぎた免許証で運転すると、無免許運転になります。",t:"「猶予期間がある」と思わせる。"},
{c:"運転者の義務",a:true,q:"住所が変わったときは、すみやかに住所地を管轄する公安委員会に届け出て、免許証の記載事項の変更を受けなければならない。",e:"警察署や運転免許試験場などで手続きします。",t:"届け出は「すみやかに」。"},
{c:"運転者の義務",a:false,q:"運転中にハンズフリー装置を使って、携帯電話を手に持たずに通話することも禁止されている。",e:"禁止されているのは、携帯電話を手に持って通話したり、画面を注視したりすることです。ただし、通話に気を取られないよう注意します。",t:"手に持つかどうかが分かれ目。"},
{c:"運転者の義務",a:true,q:"運転者は、後部座席の同乗者にもシートベルトを着用させなければならない。",e:"疾病などやむを得ない理由がある場合を除き、すべての座席で着用させます。",t:"「後部座席は不要」は×。"},
{c:"運転者の義務",a:true,q:"他の車の通行を妨げる目的で、急ブレーキをかけたり車間距離を極端に詰めたりする妨害運転（あおり運転）は、1回でも免許取り消しの対象になる。",e:"妨害運転には重い罰則があり、違反点数も高く設定されています。",t:"「注意で済む」と思わせない。"},
{c:"危険な場面・車の知識",a:true,q:"水たまりのある所を通るときは、泥水をはねて歩行者に迷惑をかけないよう、速度を落とすなどして注意する。",e:"泥はねで他人に迷惑をかけることは、法律で禁止されています。",t:"マナーではなく義務。"},
{c:"危険な場面・車の知識",a:false,q:"ベーパーロック現象を防ぐには、長い下り坂でフットブレーキを使い続けるとよい。",e:"フットブレーキを使いすぎると、ブレーキ液に気泡ができて効かなくなります。エンジンブレーキを主に使います。",t:"原因と対策の逆転。"},
{c:"危険な場面・車の知識",a:true,q:"フェード現象とは、フットブレーキを使いすぎてブレーキが過熱し、効きが悪くなる現象である。",e:"長い下り坂ではエンジンブレーキを活用します。",t:"ベーパーロックとの区別。"},
{c:"危険な場面・車の知識",a:false,q:"車の重心が高いほど、カーブで横転しにくくなる。",e:"重心が高いほど横転しやすくなります。荷物は重い物を下に積みます。",t:"高い・低いの入れ替え。"},
{c:"危険な場面・車の知識",a:true,q:"大型車の後ろを走るときは、前方の見通しが悪くなるので、車間距離を多めにとる。",e:"前の様子が見えないと、急な停止に対応できません。",t:"ふだんと同じ車間距離では不十分。"},
{c:"危険な場面・車の知識",a:true,q:"夜間、対向車の前照灯で、道路の中央付近の歩行者が見えなくなることがある。",e:"この現象を蒸発現象といいます。速度を落として注意します。",t:"夜間特有の見落とし。"},
{c:"危険な場面・車の知識",a:false,q:"夜間は、昼間に比べて速度感覚がつかみやすいので、速度を出しすぎることは少ない。",e:"夜間は周りが見えにくく、速度感覚もにぶりやすくなります。",t:"昼夜の特徴の逆転。"},
{c:"事故・災害時",a:true,q:"交通事故を起こしたときは、続いて起こる事故を防ぐため、車を安全な場所に移動させ、エンジンを止める。",e:"その後、負傷者の救護と警察官への報告を行います。",t:"まず二次事故の防止。"},
{c:"事故・災害時",a:true,q:"頭部を強く打っている負傷者は、むやみに動かしてはならないが、後続事故のおそれがあるときは安全な場所に移す。",e:"動かす必要があるときは、できるだけ体を動かさないように注意します。",t:"「絶対に動かさない」ではない。"},
{c:"事故・災害時",a:true,q:"交通事故の現場に居合わせたときは、負傷者の救護や事故車の移動などに協力する。",e:"事故の当事者でなくても、できる範囲で協力します。",t:"当事者以外の役割。"},
{c:"信号・合図",a:true,q:"警察官が腕を水平に上げているとき、その腕の方向と平行する交通は、青色の灯火と同じ意味である。",e:"対面する交通は、赤色の灯火と同じ意味です。",t:"平行と対面の入れ替えに注意。"},
{c:"信号・合図",a:true,q:"徐行や停止をするときは、ブレーキを数回に分けて踏み、制動灯を点滅させて後続車に知らせるとよい。",e:"急ブレーキは追突の原因になります。",t:"ブレーキの踏み方の基本。"},
{c:"AT車の運転",a:false,q:"AT車で前進と後退を切り替えるときは、車が完全に止まる前でもセレクトレバーを操作してよい。",e:"車が完全に止まってから、ブレーキを踏んだままレバーを操作します。",t:"止まる前の操作は故障や事故の原因。"},
{c:"AT車の運転",a:true,q:"AT車で運転席を離れるときは、短い時間でもセレクトレバーをPに入れ、ハンドブレーキをかける。",e:"エンジンを止めることも大切です。",t:"「すぐ戻るから」は通用しない。"},
{c:"交差点",a:false,q:"交差点の中を通行しているときに緊急自動車が近づいてきたら、その場ですぐに一時停止する。",e:"交差点を出て、道路の左に寄って一時停止します。交差点の中で止まると、かえって妨げになります。",t:"止まる「場所」のひっかけ。"},
{c:"交差点",a:false,q:"前の車が右折するため道路の中央に寄って止まっているときは、その右側を通って前に出てよい。",e:"前の車が右折のため中央に寄っているときは、その左側を通行します。",t:"追い越しは右側、の原則の例外。"},
{c:"自転車・二輪",a:true,q:"自転車を押して歩いている人は、歩行者として扱われる。",e:"自転車を押して歩くときは、歩道や横断歩道を通行できます。",t:"乗っていなければ歩行者。"},
{c:"自転車・二輪",a:false,q:"自転車に乗るときのヘルメットは、法律で着用が求められていないので、かぶる必要はない。",e:"2023年4月から、すべての自転車利用者にヘルメット着用の努力義務があります。",t:"罰則がない＝必要ない、ではない。"},
{c:"自転車・二輪",a:true,q:"自転車も、夜間は前照灯や尾灯（または反射器材）をつけて走らなければならない。",e:"無灯火は違反で、青切符の対象にもなります。",t:"自転車も灯火の義務がある。"},
{c:"自転車・二輪",a:true,q:"一時停止の標識がある場所では、自転車も一時停止しなければならない。",e:"自転車も標識に従う義務があります。",t:"「自転車は関係ない」は×。"},
{c:"踏切・坂道",a:true,q:"踏切を通過するときは、左側に寄りすぎると落輪するおそれがあるので、対向車に注意しながらやや中央寄りを通行する。",e:"踏切内は路面が悪いことがあるので、左端に寄りすぎないようにします。",t:"ふだんの「左寄り」とのちがい。"},
{c:"踏切・坂道",a:false,q:"踏切の手前で一時停止したときは、窓を閉めて外の音が入らないようにしてから安全を確かめる。",e:"窓を開けるなどして、目と耳で列車が来ないことを確かめます。",t:"耳での確認を消している。"},
{c:"高速道路",a:false,q:"高速道路で眠くなったときは、路肩に止めて仮眠するとよい。",e:"路肩での駐停車は禁止です。サービスエリアやパーキングエリアで休憩します。",t:"「安全のため」でも路肩は×。"},
{c:"運転者の義務",a:false,q:"普通免許があれば、乗車定員11人のマイクロバスを運転することができる。",e:"普通免許で運転できるのは、乗車定員10人以下の自動車です。",t:"11人以上は中型免許以上。"},
{c:"運転者の義務",a:false,q:"酒を飲んだ人が運転する車に同乗しても、自分が運転していなければ罰則の対象にはならない。",e:"飲酒運転と知りながら同乗した人も罰せられます。",t:"同乗者にも責任がある。"},
{c:"危険な場面・車の知識",a:false,q:"運動エネルギーは速度に比例するので、速度が2倍になると運動エネルギーも2倍になる。",e:"運動エネルギーは速度の2乗に比例するので、速度が2倍になると4倍になります。",t:"比例と2乗の入れ替え。"},
{c:"危険な場面・車の知識",a:true,q:"衝突したときの衝撃力は、速度が速いほど、車の重量が重いほど大きくなる。",e:"固い物に衝突したときほど、衝撃力は大きくなります。",t:"速度だけでなく重さも関係する。"},
{c:"危険な場面・車の知識",a:false,q:"下り坂では加速がつきやすいので、上り坂よりも車間距離を短くする。",e:"下り坂では止まりにくくなるので、車間距離を長めにとります。",t:"短く・長くの入れ替え。"},
{c:"危険な場面・車の知識",a:true,q:"ABS（アンチロックブレーキシステム）を備えた車でも、路面の状態によっては停止距離が長くなることがある。",e:"ABSは急ブレーキのときにタイヤのロックを防ぎ、ハンドル操作をしやすくする装置です。",t:"ABS＝必ず早く止まる、ではない。"},
{c:"事故・災害時",a:true,q:"負傷者の出血が多いときは、清潔なガーゼやハンカチなどで傷口を直接強く押さえて止血する。",e:"直接圧迫止血法と呼ばれる方法です。",t:"止血の基本。"},
{c:"事故・災害時",a:true,q:"心肺蘇生で胸骨圧迫をするときは、1分間に100回から120回のテンポで行う。",e:"胸の真ん中を、強く、速く、絶え間なく押します。",t:"テンポの数字。"},
{c:"事故・災害時",a:true,q:"大地震のとき、津波から避難するためやむを得ない場合を除き、避難のために車を使ってはならない。",e:"車での避難は渋滞を生み、緊急車両の通行を妨げます。",t:"津波のときだけ例外がある。"},
{c:"二輪車の運転",a:false,q:"二輪車で雨の日にブレーキをかけるときは、一度に強くかけて早めに止まる。",e:"ぬれた路面では、ブレーキを数回に分けてかけ、スリップを防ぎます。",t:"雨の日は一度に強くかけない。"},
{l:1,h:1,c:"速度・車間距離",a:false,q:"左右の見通しのきかない交差点（信号機がある場合や優先道路を通行している場合を除く）、道路の曲がり角付近、上り坂の頂上付近、こう配の急な上り坂は、いずれも徐行しなければならない場所である。",e:"徐行場所は「こう配の急な下り坂」です。上り坂は頂上付近だけが徐行場所です。",t:"4つ目だけ上りと下りを入れ替えた列挙。"},
{l:1,h:1,c:"高速道路",a:false,q:"高速道路の本線車道では、転回、後退、横断、駐停車がいずれも禁止されているが、路側帯や路肩を通行することは認められている。",e:"路側帯や路肩も、故障などやむを得ない場合を除き通行できません。",t:"前半を正しくして、最後だけ誤りにした列挙。"},
{l:1,h:1,c:"運転者の義務",a:false,q:"普通免許では、普通自動車、小型特殊自動車、原動機付自転車、普通自動二輪車を運転することができる。",e:"普通自動二輪車を運転するには、普通二輪免許が必要です。",t:"1つだけ運転できない車を混ぜた列挙。"},
{l:1,h:1,c:"信号・合図",a:false,q:"左折と右折の合図はその行為をしようとする地点の30メートル手前、進路変更の合図も30メートル手前で行う。",e:"進路変更の合図は約3秒前です。",t:"1つだけ単位を入れ替えた列挙。"},
{l:1,h:1,c:"危険な場面・車の知識",a:true,q:"停止距離は空走距離と制動距離を合わせたもので、疲れているときは空走距離が、路面がぬれているときは制動距離が長くなる。",e:"疲れていると反応が遅れ、ぬれた路面ではタイヤが滑りやすくなります。",t:"どちらが長くなるかの組み合わせ。"},
{l:1,h:1,c:"危険な場面・車の知識",a:false,q:"停止距離は空走距離と制動距離を合わせたもので、疲れているときは制動距離が、路面がぬれているときも制動距離が長くなる。",e:"疲れているときに長くなるのは空走距離です。",t:"組み合わせを1つだけ入れ替えた列挙。"},
{h:1,c:"通行方法",a:false,q:"車両通行帯が黄色の線で区画されているところでも、追い越しのためであれば、右側の通行帯に進路を変更してよい。",e:"黄色の線は進路変更禁止です。追い越しのためでも越えてはいけません。",t:"目的があれば許される、と思わせる。"},
{h:1,c:"追い越し・行き違い",a:true,q:"トンネル内でも、車両通行帯がある場合は、追い越しは禁止されていない。",e:"ただし、トンネル内は車両通行帯の有無にかかわらず駐停車禁止です。",t:"追い越しと駐停車で条件がちがう。"},
{h:1,c:"信号・合図",a:false,q:"交差点以外の道路で警察官が停止の手信号をしているとき、近くに横断歩道があっても、警察官の1メートル手前で止まればよい。",e:"横断歩道や自転車横断帯、踏切があるときは、その手前で止まります。",t:"止まる位置の条件をつく意地悪問題。"}
);

/* ===== 標識・標示（SVG）：道路標識一覧（2021年9月現在）の図柄に準拠 ===== */
const RED="#d7262e", BLUE="#1d5fb4", YEL="#f7c600", BLK="#1a1a1a";
const FONT = `font-family="-apple-system,'Hiragino Sans','Noto Sans JP',Arial,sans-serif"`;

/* ===== 読み上げ ===== */
function canSpeak(){ return typeof window!=="undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined"; }
function toSpeech(t){
  return String(t).replace(/○/g,"マル").replace(/×/g,"バツ").replace(/km\/h/g,"キロ").replace(/(\d)kg/g,"$1キログラム")
    .replace(/(\d)cc/g,"$1シーシー").replace(/(\d)mm/g,"$1ミリ").replace(/(\d)m\b/g,"$1メートル").replace(/(\d)m(?=[^a-zA-Z])/g,"$1メートル")
    .replace(/(\d)t\b/g,"$1トン").replace(/[（(]/g,"、").replace(/[）)]/g,"、").replace(/[／/]/g,"、");
}
function jaVoices(){
  if(!canSpeak()) return [];
  try{ return speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang)); }catch(e){ return []; }
}
function pickVoice(){
  const vs=jaVoices(); const want=(typeof store!=="undefined"&&store.settings)?store.settings.voice:"";
  return vs.find(v=>v.voiceURI===want) || null;
}
function speak(t){
  if(!canSpeak()) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(toSpeech(t)); u.lang="ja-JP";
    const v=pickVoice(); if(v) u.voice=v;
    const st=(typeof store!=="undefined"&&store.settings)?store.settings:{};
    u.rate=st.rate||1.05; u.pitch=st.pitch||1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){ if(canSpeak()) try{ speechSynthesis.cancel(); }catch(e){} }

/* ===== 冥鳴ひまりの音声（VOICEVOX）再生 =====
   AUDIO_NAMES / AUDIO_BYTES はビルド時に埋め込み。音声は audio/<名前>.m4a
   キューの1項目：{clip:"t5_q", text:"…"}（クリップが無い・失敗したら端末の声で text を読む）／{sil:秒} */
const AUDIO_CACHE = "gakka-audio-v2";
try{ caches.delete("gakka-audio-v1"); }catch(e){}
const AUDIO_SET = new Set(typeof AUDIO_NAMES!=="undefined" ? AUDIO_NAMES.split(",") : []);
/* 各クリップの長さ（秒）。聞き流しで1本につなげるときの時刻計算に使う */
const AUDIO_DUR = new Map();
if(typeof AUDIO_MS!=="undefined"){ const ms=AUDIO_MS.split(","); [...AUDIO_SET].forEach((n,i)=>AUDIO_DUR.set(n,Number(ms[i])/1000)); }
const AU = {el:null, q:[], gen:0, onDone:null, blobs:new Map(), unlocked:false, paused:false};

function hasHimari(){ return AUDIO_SET.size>0; }
function useHimari(){ return hasHimari() && (store.settings.engine||"himari")==="himari"; }
function canVoice(){ return useHimari() || canSpeak(); }
function audioEl(){
  if(!AU.el){ AU.el = new Audio(); AU.el.preload="auto"; try{ AU.el.preservesPitch=true; AU.el.webkitPreservesPitch=true; }catch(e){} }
  return AU.el;
}
/* iPhoneは最初の再生をタップの中で行う必要があるので、最初のタップで無音を鳴らして解錠しておく */
const SILENT_WAV="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
function unlockAudio(){
  if(AU.unlocked) return; AU.unlocked=true;
  try{ const el=audioEl(); el.src=SILENT_WAV; const p=el.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
}
document.addEventListener("touchend", unlockAudio, {passive:true});
document.addEventListener("click", unlockAudio);

function clipURL(name){ return "audio/"+name+".aac"; }
function clipBlob(name){
  if(AU.blobs.has(name)) return AU.blobs.get(name);
  const p = fetch(clipURL(name)).then(r=>{ if(!r.ok) throw new Error("http"); return r.blob(); })
    .then(b=>URL.createObjectURL(b));
  p.catch(()=>AU.blobs.delete(name));
  AU.blobs.set(name,p);
  if(AU.blobs.size>40){ const k=AU.blobs.keys().next().value; const old=AU.blobs.get(k); AU.blobs.delete(k); old.then(u=>URL.revokeObjectURL(u)).catch(()=>{}); }
  return p;
}
function silName(s){ return "sil"+String(s).replace(".","_"); }
function prefetch(){
  if(!useHimari()) return;
  AU.q.slice(0,3).forEach(it=>{ const n = it.clip&&AUDIO_SET.has(it.clip) ? it.clip : it.sil&&AUDIO_SET.has(silName(it.sil)) ? silName(it.sil) : null; if(n) clipBlob(n); });
}
function wait(ms,g){ return new Promise(r=>{ const t0=Date.now(); const f=()=>{ if(g!==AU.gen||Date.now()-t0>=ms) r(); else setTimeout(f,100); }; f(); }); }
function playClip(name,g){
  return clipBlob(name).then(url=>new Promise((res,rej)=>{
    if(g!==AU.gen) return res();
    const el=audioEl();
    const done=()=>{ el.onended=el.onerror=null; clearInterval(chk); res(); };
    const chk=setInterval(()=>{ if(g!==AU.gen) done(); },250);
    el.onended=done; el.onerror=()=>{ el.onended=el.onerror=null; clearInterval(chk); rej(new Error("play")); };
    el.src=url; el.playbackRate=Number(store.settings.hrate||1)*(AU.rateMul||1);
    const p=el.play(); if(p&&p.catch) p.catch(e=>{ el.onended=el.onerror=null; clearInterval(chk); rej(e); });
  }));
}
function speakP(text,g){
  return new Promise(res=>{
    if(!canSpeak()||g!==AU.gen) return res();
    try{
      const u=new SpeechSynthesisUtterance(toSpeech(text)); u.lang="ja-JP";
      const v=pickVoice(); if(v) u.voice=v;
      u.rate=store.settings.rate||1.05; u.pitch=store.settings.pitch||1;
      let fin=false; const end=()=>{ if(!fin){ fin=true; clearInterval(chk); res(); } };
      const t0=Date.now(), lim=4000+String(text).length*400;  // onendが来ない端末向けの保険
      const chk=setInterval(()=>{ if(g!==AU.gen||Date.now()-t0>lim) end(); },250);
      u.onend=end; u.onerror=end; speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}
async function runQueue(g){
  AU.running=true;
  try{ await runQueue2(g); } finally { if(g===AU.gen){ AU.running=false; AU.cur=null; } }
}
async function runQueue2(g){
  while(g===AU.gen){
    while(AU.paused && g===AU.gen) await wait(200,g);
    if(g!==AU.gen) return;
    const it=AU.q.shift();
    if(!it){ const f=AU.onDone; AU.onDone=null; if(f) f(); return; }
    prefetch();
    try{
      if(it.fn){ it.fn(); continue; }
      if(it.sil){
        let n=Math.max(1,Math.round(it.sil)); const parts=[];
        for(const c of [8,5,3,2,1]) while(n>=c){ parts.push(c); n-=c; }
        if(parts.length>1){ AU.q.unshift(...parts.slice(1).map(x=>({sil:x}))); it.sil=parts[0]; }
        else it.sil=parts[0];
        if(useHimari()&&AUDIO_SET.has(silName(it.sil))){ try{ await playClip(silName(it.sil),g); continue; }catch(e){} }
        await wait(it.sil*1000,g); continue;
      }
      AU.cur=it;
      const clr=()=>{ if(g===AU.gen) AU.cur=null; };       // 止められた古い再生が、新しい再生の目印を消さないように
      if(useHimari() && it.clip && AUDIO_SET.has(it.clip)){
        try{ await playClip(it.clip,g); clr(); continue; }catch(e){}
      }
      if(it.text) await speakP(it.text,g);
      clr();
    }catch(e){ if(g===AU.gen) AU.cur=null; }
  }
}
/* 声かけ（react）を話している途中なら、切らずに言い終わってから次を読む（声がかぶらず、ブツッと切れない） */
function reacting(){ return !!(AU.cur && AU.cur.react && AU.running); }
function playQueue(items,onDone){
  if(reacting()){ AU.q=items.filter(Boolean); AU.onDone=onDone||null; AU.paused=false; return; }
  stopAudio(); const g=AU.gen;
  AU.q=items.filter(Boolean); AU.onDone=onDone||null; AU.paused=false;
  runQueue(g);
}
function stopAudio(){
  AU.gen++; AU.cur=null; AU.running=false; AU.q=[]; AU.onDone=null; AU.paused=false;
  if(AU.el){ try{ AU.el.pause(); AU.el.onended=AU.el.onerror=null; }catch(e){} }
  if(canSpeak()) try{ speechSynthesis.cancel(); }catch(e){}
}
function pauseAudio(on){
  AU.paused=on;
  if(AU.el){ try{ if(on) AU.el.pause(); else if(AU.el.src&&!AU.el.ended&&AU.el.currentTime>0) AU.el.play(); }catch(e){} }
  if(canSpeak()) try{ on?speechSynthesis.pause():speechSynthesis.resume(); }catch(e){}
}

/* ===== 音声のダウンロード（オフライン用） ===== */
let DL = {running:false, done:0, total:0, err:0};
async function audioCachedCount(){
  try{ const c=await caches.open(AUDIO_CACHE); return (await c.keys()).length; }catch(e){ return 0; }
}
async function downloadAudio(){
  if(DL.running||!("caches" in window)) return;
  const names=[...AUDIO_SET]; DL={running:true, done:0, total:names.length, err:0}; showDL();
  try{
    const c=await caches.open(AUDIO_CACHE);
    const have=new Set((await c.keys()).map(r=>decodeURIComponent(new URL(r.url).pathname.split("/").pop())));
    let k=0;
    const worker=async()=>{
      while(k<names.length){
        const n=names[k++];
        if(!have.has(n+".aac")){ try{ const r=await fetch(clipURL(n),{cache:"no-store"}); if(!r.ok) throw 0; await c.put(clipURL(n), r); }catch(e){ DL.err++; } }
        DL.done++; if(DL.done%20===0||DL.done===DL.total) showDL();
      }
    };
    await Promise.all([1,2,3,4,5,6].map(worker));
  }catch(e){ DL.err++; }
  DL.running=false; showDL(true);
}
async function deleteAudio(){
  if(!confirm("ダウンロードした音声を削除しますか？（端末の空き容量が増えます）")) return;
  try{ await caches.delete(AUDIO_CACHE); }catch(e){}
  showDL(true);
}
async function showDL(final){
  const el=document.getElementById("dlStatus"); if(!el) return;
  if(DL.running){ el.innerHTML=`ダウンロード中… ${DL.done} / ${DL.total}<div class="mbar"><i style="width:${DL.total?DL.done/DL.total*100:0}%"></i></div>`; return; }
  const n=await audioCachedCount(); const all=AUDIO_SET.size;
  const btn=document.getElementById("dlBtn");
  if(n>=all){ el.innerHTML=`✓ 音声はダウンロード済み（${all}本）。ネットがなくても声で読み上げます。 <button class="link" onclick="deleteAudio()">削除</button>`; if(btn) btn.style.display="none"; }
  else{
    el.innerHTML = (n?`${n} / ${all}本 保存済み。`:"まだ保存されていません。")+(DL.err&&final?`（${DL.err}本 失敗。電波の良い所でもう一度押してください）`:"")+" ネットにつながっていれば、保存しなくても声は流れます。";
    if(btn) btn.style.display="";
  }
}
function audioMB(){ return typeof AUDIO_BYTES!=="undefined" ? Math.round(AUDIO_BYTES/1048576) : 0; }

function idOf(it){ return it.flash!==undefined ? "f"+it.flash : it.id; }
function listenPool(src){
  if(src==="flash") return shuffle(FLASH.map((f,i)=>({flash:i})));
  if(src==="kk") return smartOrder(BANK_KK);
  let pool;
  if(src==="weak") pool = everything().filter(q=>isWeak(q.id));
  else if(src==="due") pool = everything().filter(q=>isDue(q.id));
  else if(src==="kouka") pool = tfAll().filter(q=>q.kouka);
  else pool = tfAll();
  return smartOrder(pool.filter(q=>!q.sign));   // 苦手・未回答・苦手分野が前に来やすい
}
function listenCount(src){ return listenPool(src).length; }
/* 前回の続き：store.lq[src] に「まだ聞いていない順番」を保存 */
function sessionList(src){
  const pool=listenPool(src), byId=new Map(pool.map(x=>[idOf(x),x]));
  const up=((store.lq||{})[src]||[]).filter(id=>byId.has(id)).map(id=>byId.get(id));
  const list=up.concat(pool);
  return {list, ends: up.length? [up.length, list.length] : [list.length]};
}
function leftCount(src){ const n=listenCount(src); const up=((store.lq||{})[src]||[]).length; return up&&up<n ? up : 0; }
/* 聞けたのは先頭から k 問まで、として保存 */
function saveHeard(k,force){
  if(!L||(!force&&k<L.savedK)) return; L.savedK=k;
  const seen=new Set(), rest=[];
  const end=L.ends.find(e=>e>k) ?? L.list.length;          // k が入っている「ひと巡り」の残りだけを保存
  for(const it of L.list.slice(k,end)){ const id=idOf(it); if(!seen.has(id)){ seen.add(id); rest.push(id); } }
  store.lq=store.lq||{}; store.lq[L.src]=rest;
  const heard=L.list.slice(0,k).map(idOf).filter(id=>id[0]!=="f");
  store.lastListen={at:L.started, ids:[...new Set(heard)], done:false, style:L.style};
  save();
}
function setListen(k,v){ store.settings[k]=v; save(); }
function listenHome(){
  const st=store.settings, src=st.listenSrc||"all", sty=st.listenStyle||"sleep";
  const left=leftCount(src);
  return `
    <h2>聞き流し</h2>
    <div class="seg small">
      <button class="${sty==="sleep"?"on":""}" onclick="setListen('listenStyle','sleep');home()">🌙 寝る前<small>後半ほどゆったり</small></button>
      <button class="${sty==="commute"?"on":""}" onclick="setListen('listenStyle','commute');home()">🚶 通学・散歩<small>テンポよく・褒めてくれる</small></button>

    <div class="chips lsrc">${LSRC.map(([k,n])=>`<button class="chip ${k===src?"on":""}" onclick="setListen('listenSrc','${k}');home()">${n}（${listenCount(k)}）</button>`).join("")}</div>

function morningIds(){
  const ll=store.lastListen; if(!ll||ll.done||!ll.ids||!ll.ids.length) return [];
  const h=(Date.now()-ll.at)/3600000; if(h<1||h>48) return [];
  const all=new Map(everything().map(q=>[q.id,q]));
  return ll.ids.filter(id=>all.has(id));
}
function morningCard(){
  const ids=morningIds(); if(!ids.length) return "";
  const n=Math.min(10,ids.length), night=store.lastListen.style!=="commute";
  return `<button class="btn morning-btn" onclick="startMorning()">${night?"☀ 昨夜":"🎧 前回"}の聞き流しから確認テスト ${n}問<small>聞いた問題を、ちゃんと覚えているか○×で確かめます</small></button>`;
}
function startMorning(){
  const all=new Map(everything().map(q=>[q.id,q]));
  const list=shuffle(morningIds().map(id=>all.get(id))).slice(0,10);
  store.lastListen.done=true; save();
  startSet(prepKK(list), (store.lastListen.style!=="commute"?"昨夜":"前回")+"の聞き流しから");
}

function startListen(){
  stopAudio(); stopTimer(); S=null;
  const st=store.settings, src=st.listenSrc||"all";
  const {list,ends}=sessionList(src); if(!list.length) return;
  const min=st.listenMin??30, sty=st.listenStyle||"sleep";
  L={src, list, ends, style:sty, i:0, phase:"q", paused:false, finished:false, started:Date.now(), savedK:-1,
     end: min ? Date.now()+min*60000 : null, count:0, t0:Date.now(), lastLt:-9, lastFl:"", lastHist:-9, lastFast:false};
  try{
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata = new MediaMetadata({title:sty==="sleep"?"聞き流し（寝る前）":"聞き流し（通学・散歩）", artist:"学科試験対策", album:"VOICEVOX:冥鳴ひまり"});
      navigator.mediaSession.setActionHandler("pause",()=>listenPause(true));
      navigator.mediaSession.setActionHandler("play",()=>listenPause(false));
      navigator.mediaSession.setActionHandler("nexttrack",()=>listenSkip());
    }
  }catch(e){}
  L.tid=setInterval(()=>{ const el=document.getElementById("ltimer"); if(el&&L) el.textContent=listenLeft(); },1000);
  if(useHimari()){
    unlockAudio(); try{ const el=audioEl(); el.src=SILENT_WAV; const pr=el.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}  // タップの中で再生を許可させる
    startStream().catch(e=>{ if(!L) return; L.marks=null; L.prep=null; const sl=sessionList(L.src); L.list=sl.list; L.ends=sl.ends; L.i=0; L.count=0; L.lastHist=-9; L.lastLt=-9;
      L.note="音声を1本にまとめられなかったので、1問ずつ読みます（画面を消すと止まることがあります）。先に「音声をダウンロード」をしておくと確実です。"; listenStep(); });
  } else listenStep();
}

function listenCur(){ return L.list[L.i]; }
function rnd(p){ return Math.random()<p; }
/* 思わせぶりな声：いつも混ぜる（声をかけるときの約4割） */
function coy(){ return 0.4; }
const COYMAP={pre:"mpre",cpre:"mpre",th:"mth",an:"man",lt:"mlt"};
function fl(k){ if(COYMAP[k] && Math.random()<coy()*0.7) k=COYMAP[k];
  const a=FL[k]; let x=a[Math.floor(Math.random()*a.length)];
  if(L&&L.lastFl===x[0]) x=a[(a.indexOf(x)+1)%a.length]; if(L) L.lastFl=x[0]; return {clip:x[0], text:x[1]}; }
/* 進み具合 0〜1（タイマーなしなら4時間で1） */
function listenProg(){ if(!L) return 0; if(!L.end) return Math.min(0.5,(Date.now()-L.t0)/(240*60000)); return Math.min(1,(Date.now()-L.t0)/(L.end-L.t0)); }
/* これまでの成績から：new=初めて／wrong=前回まちがい／easy=何度も正解／normal */
function histOf(it){
  if(it.flash!==undefined) return store.flash[it.flash]? "easy" : "normal";
  const st=stat(it.id), n=st.c+st.w;
  if(!n) return "new";
  if(st.last===false || isWeak(it.id)) return "wrong";
  if(isMastered(it.id) || (n>=2 && st.c/n>=0.8 && st.last===true)) return "easy";
  return "normal";
}

/* 1問ぶんの読み上げ内容（late=寝る前モードのタイマー後半の度合い 0〜1） */
function planQuestion(it, late){
  const cm = L.style==="commute"; if(cm) late=0;
  const think=store.settings.listenThink||5;
  const slow=(1+late*0.7)*(cm?0.75:1);                      // 寝る前は最後に1.7倍まで／通学は短め
  const gap=x=>({sil:x*slow});
  /* 成績にあわせたひと言・早送り。よく正解する問題は多いので、言う頻度に間隔をあけて散らす */
  const h=histOf(it), since=L.count-L.lastHist;
  let say=null, fast=false;
  if(h==="wrong" && since>=2 && rnd(0.65)) say=cm?"chw":"hw";
  else if(h==="easy"){
    fast = rnd(L.lastFast? 0.3 : 0.55);
    if(since>=(cm?3:4) && rnd(cm?0.4:0.3)) say = fast&&rnd(0.5) ? "ff" : (cm?"che":"he");
    else if(fast && since>=2 && rnd(0.35)) say="ff";
  }
  else if(h==="new" && since>=5 && rnd(0.15)) say="hn";
  if(say) L.lastHist=L.count;
  L.lastFast=fast;
  const showA={fn:"showA"};
  let items=[];
  if(L.count){
    items.push(gap(fast?1:1.5));
    if(!cm && late>0.1 && L.count-L.lastLt>=3 && rnd(0.25+late*0.5)){ items.push(fl("lt"), gap(4)); L.lastLt=L.count; }
    if(!say) items.push(cm ? (rnd(0.55)? fl("cpre") : rnd(0.5)? fl("pre") : {clip:"r_next", text:"次の問題。"})
                           : (rnd(0.5)? fl("pre") : {clip:"r_next", text:"次の問題。"}), {sil:1});
  }
  if(say) items.push(fl(say), {sil:1});
  const thinkPart=()=>{ if(fast) return [{sil:1.5}]; const t=think*slow; return rnd(cm?0.25:0.4)? [{sil:t*0.5}, fl("th"), {sil:t*0.5}] : [{sil:t}]; };
  const stretch=a=>a.map(x=>x.sil?gap(x.sil):x);
  if(it.flash!==undefined){
    items=items.concat(itemsFlashFront(it.flash), thinkPart(), [showA], itemsFlashBack(it.flash));
    if(cm && rnd(0.35)) items.push({sil:1}, fl("cp"));
  }else if(it.kind==="kk"){
    let ans=stretch(itemsKKAnswer(it,null)); if(fast) ans=ans.filter(x=>!(x.clip&&/_tip$/.test(x.clip)));
    items=items.concat(itemsKKQuestion(it), thinkPart(), [showA], ans);
    if(cm && rnd(0.5)) items.push({sil:1}, fl("cp"));
  }else{
    let ans=stretch(itemsTFAnswer(it,null));
    if(fast && rnd(0.7)) ans=ans.slice(0,1);                 // 早送りは答えだけ（たまにポイントも）
    else if(fast) ans=ans.filter(x=>!(x.clip&&/_t$/.test(x.clip)));
    if(rnd(0.5)){ ans[0]={clip:it.ans?"a_o":"a_x", text:it.ans?"マル。":"バツ。"}; ans.unshift(fl("an")); }
    items=items.concat(itemsTFQuestion(it), thinkPart(), [showA], ans);
    if(h==="wrong" && rnd(0.5)) items.push({sil:1}, fl("hwa"));
    else if(cm && rnd(fast?0.3:0.5)) items.push({sil:1}, fl("cp"));
    else if(!cm && !fast && rnd(0.3)) items.push({sil:1}, fl("af"));
  }
  const n=L.count+1;
  if(cm && n%10===0 && n<=100) items.push({sil:1}, {clip:"fl_cms"+n, text:n+"問！"});
  items.push(gap(fast?1:2));
  return {items, fast};
}
function endItems(){
  const c=Math.random()<coy();
  return L.style==="commute" ? [{sil:2}, c? {clip:"fl_mendc1", text:"今日も、付き合ってくれて、ありがと。またね。"} : {clip:"r_end_c", text:"おつかれさま！ 今日も、よくがんばったね。"}]
                             : [{sil:3}, c? {clip:"fl_mends1", text:"おやすみ。また、夢で会おうね。"} : {clip:"r_end", text:"今日はここまで。おやすみなさい。"}]; }

/* ===== ひまりの声：最初に全部を1本の音声につなげて流す ===== */
function silParts(x){ let n=Math.max(1,Math.round(x)); const a=[]; for(const c of [8,5,3,2,1]) while(n>=c){ a.push("sil"+c); n-=c; } return a; }
async function startStream(){
  const min=L.end? Math.round((L.end-L.t0)/60000) : 0;
  const total=(min||120)*60;
  const seq=[], marks=[]; let t=0;
  const add=n=>{ if(AUDIO_SET.has(n)){ seq.push(n); t+=AUDIO_DUR.get(n)||0; } };
  let i=0;
  while(t<total){
    if(i>=L.list.length){ L.list=L.list.concat(listenPool(L.src)); L.ends.push(L.list.length); }
    const it=L.list[i++], p=min? t/total : Math.min(0.5,t/(240*60)), late=Math.max(0,(p-0.5)*2);
    const mk={it, q:t, a:null};
    for(const x of planQuestion(it,late).items){
      if(x.fn) mk.a=t;
      else if(x.sil) silParts(x.sil).forEach(add);
      else if(x.clip) add(x.clip);
    }
    marks.push(mk); L.count++;
  }
  const endAt=t; endItems().forEach(x=>x.sil? silParts(x.sil).forEach(add) : add(x.clip));
  L.marks=marks; L.endAt=endAt; L.total=t; L.i=0; L.count=0;
  // 寝る前は後半（うとうと）を「聞けていない」扱いにして、次回そこから。通学は全部聞けた扱い
  const cut = L.style==="commute" ? endAt : (min? total/2 : Math.min(endAt, 30*60));
  saveHeard(marks.filter(m=>m.q<cut).length);
  // 必要なクリップを集めて1本に
  const uniq=[...new Set(seq)], bufs=new Map(); let k=0, got=0;
  L.prep=`準備中… 0 / ${uniq.length}`; renderListen();
  const worker=async()=>{ while(k<uniq.length){ const n=uniq[k++];
    const r=await fetch(clipURL(n)); if(!r.ok) throw new Error("fetch "+n);
    bufs.set(n, await r.arrayBuffer()); got++;
    if(got%40===0&&L){ L.prep=`準備中… ${got} / ${uniq.length}`; renderListen(); } } };
  await Promise.all([1,2,3,4,5,6].map(worker));
  if(!L) return;
  const url=URL.createObjectURL(new Blob(seq.map(n=>bufs.get(n)),{type:"audio/aac"}));
  L.url=url; L.prep=null;
  const el=audioEl();
  el.onended=()=>{ if(L){ L.finished=true; L.phase="end"; renderListen(); } };
  el.onerror=null;
  el.ontimeupdate=()=>listenSync();
  el.src=url; el.playbackRate=Number(store.settings.hrate||1);
  renderListen();
  await el.play();
}
function listenSync(){
  if(!L||!L.marks) return;
  const ct=audioEl().currentTime;
  let i=0; while(i+1<L.marks.length && L.marks[i+1].q<=ct) i++;
  const phase = ct>=L.endAt ? "end" : (L.marks[i].a!=null && ct>=L.marks[i].a ? "a" : "q");
  const el=document.getElementById("ltimer"); if(el) el.textContent=listenLeft();
  if(i!==L.i||phase!==L.phase){ L.i=i; L.count=i; L.phase=phase; renderListen(); }
}

/* ===== 端末の声：1問ずつ読む（画面を消すと止まることがある） ===== */
function listenStep(){
  if(!L) return;
  if(L.end && Date.now()>=L.end){
    L.phase="end"; renderListen();
    playQueue(endItems(), ()=>{ if(L){ L.finished=true; renderListen(); } });
    return;
  }
  if(L.i>=L.list.length){ L.list=L.list.concat(listenPool(L.src)); L.ends.push(L.list.length); }
  const p=listenProg(), late=Math.max(0,(p-0.5)*2);
  const {items}=planQuestion(listenCur(), late);
  L.phase="q"; renderListen();
  playQueue(items.map(x=>x.fn? {fn:()=>{ if(L){ L.phase="a"; renderListen(); } }} : x), ()=>{
    if(!L) return; L.i++; L.count++;
    if(L.style==="commute" || late===0) saveHeard(L.i);
    listenStep(); });
}
function listenPause(on){
  if(!L) return; L.paused=on;
  if(L.marks){ const el=audioEl(); try{ on? el.pause() : el.play(); }catch(e){} }
  else pauseAudio(on);
  renderListen();
}
function listenSkip(){
  if(!L||L.finished) return;
  if(L.marks){ const m=L.marks[L.i+1]; const el=audioEl(); el.currentTime = m? m.q : L.endAt; if(L.paused) listenPause(false); return; }
  stopAudio(); L.i++; L.count++; listenStep();
}
function listenStop(){
  if(L){
    // 自分で止めた＝そこまでは起きて聞いていた
    if(L.marks){ const ct=audioEl().currentTime; saveHeard(L.marks.filter(m=>m.q<=ct-3).length,true); }
    else saveHeard(L.i,true);
    if(L.tid) clearInterval(L.tid); if(L.url) URL.revokeObjectURL(L.url);
  }
  const el=AU.el; if(el){ el.ontimeupdate=null; el.onended=null; }
  L=null; AU.rateMul=1; stopAudio(); home();
}
function renderListen(){
  if(!L) return;
  const it = L.i<L.list.length ? listenCur() : null, showA = L.phase==="a";
  let body="";
  if(L.prep){
    body=`<div class="lq center">${esc(L.prep)}</div><div class="sub center">聞き流しの音声を1本にまとめています</div>`;
  }else if(L.phase==="end"||L.finished){
    body=`<div class="lq center">${L.style==="commute"?"おつかれさま！":"おやすみなさい"}</div><div class="sub center">${L.count}問 聞きました</div>`;
  }else if(it && it.flash!==undefined){
    const f=FLASH[it.flash];
    body=`<span class="qcat">${esc(f[0])}</span><div class="lq">${esc(f[1])}</div>${showA?`<div class="la">${esc(f[2])}</div>`:""}`;
  }else if(it && it.kind==="kk"){
    body=`<span class="qcat">危険予測</span><div class="lq small">${esc(it.s)}</div>
      ${it.items.map((x,j)=>`<div class="lk">(${j+1}) ${esc(x.q)} ${showA?`<b class="${x.ans?"pass":"fail"}">${ox(x.ans)}</b>`:""}</div>`).join("")}`;
  }else if(it){
    body=`<span class="qcat">${esc(it.cat)}</span><div class="lq">${esc(it.q)}</div>
      ${showA?`<div class="la ${it.ans?"pass":"fail"}">${ox(it.ans)}</div>${it.exp?`<div class="lexp">${esc(it.exp)}</div>`:""}${it.trap?`<div class="lexp trap">${esc(it.trap)}</div>`:""}`:""}`;
  }
  app.innerHTML=`
    <div class="listen">
    <div class="topbar"><button class="link" onclick="listenStop()">← 終わる</button><span>${L.style==="commute"?"🚶":"🌙"} 聞き流し　${L.count+1}問目</span><span id="ltimer" class="tr">${listenLeft()}</span></div>
    <div class="card lcard">${body}</div>
    ${L.finished?`<button class="btn center" onclick="listenStop()">ホームへ戻る</button>`:`
    <div class="row">
      <button class="btn ghost center" onclick="listenPause(${!L.paused})">${L.paused?"▶ 再開":"❚❚ 一時停止"}</button>
      <button class="btn ghost center" onclick="listenSkip()">次へ ▶▶</button>
    </div>`}
    ${L.note?`<div class="sub center">${esc(L.note)}</div>`:""}
    <div class="sub center">${useHimari()?"音声：VOICEVOX:冥鳴ひまり":""}</div>
    </div>`;
}

/* ===== データ整形 ===== */
const BANK_TF = TF.map((q,i)=>({id:"t"+i,kind:"tf",cat:q[0],ans:q[1],q:q[2],exp:q[3],sign:q[4]||null,trap:TRAP[i]||"",hard:false}))
  .concat(EXTRA.map((x,i)=>({id:"x"+i,kind:"tf",cat:x.c,ans:x.a,q:x.q,exp:x.e,sign:x.s||null,trap:x.t||"",hard:!!x.h,list:!!x.l,kouka:!!x.k})));
const BANK_KK = KIKEN.map((k,i)=>({id:"k"+i,kind:"kk",cat:"危険予測",s:k.s,tip:KK_TIP[i]||"",items:k.items.map(x=>({ans:x[0],q:x[1],exp:x[2]}))}));

/* ===== ストレージ ===== */
const KEY = "gakkaQuiz.tokyo.v2";
let store = {stats:{}, custom:[], settings:{}, srs:{}, flash:{}};
try{ const s = localStorage.getItem(KEY); if(s) store = Object.assign(store, JSON.parse(s)); }catch(e){}
store.settings = Object.assign({answerMode:"instant", timeLimit:false, includeHard:false, tts:false, voice:"", rate:1.05, pitch:1, engine:"himari", hrate:1, listenSrc:"all", listenMin:30, listenThink:5, listenStyle:"sleep", react:true}, store.settings||{});
store.srs = store.srs||{}; store.flash = store.flash||{};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

function tfEvery(){ return BANK_TF.concat(store.custom.map(c=>Object.assign({kind:"tf",sign:null,trap:"",hard:false},c))); }
function tfAll(){ return store.settings.includeHard ? tfEvery() : tfEvery().filter(q=>!q.hard); }
function hardAll(){ return tfEvery().filter(q=>q.hard); }
function everything(){ return tfAll().concat(BANK_KK); }
function stat(id){ return store.stats[id] || {c:0,w:0,last:null}; }
/* 苦手：一度でも間違えた問題は、あとから3回続けて正解する（迷った正解は数えない）まで苦手に残す */
const GRAD = 3;
function streakOf(s){ return s.k!==undefined ? s.k : (s.last===false ? 0 : s.w>0 ? 1 : s.c); }
function isWeak(id){ const s = stat(id); return s.w>0 && streakOf(s)<GRAD; }
function weakLeft(id){ return Math.max(0, GRAD-streakOf(stat(id))); }

/* ===== 共通 ===== */
const app = document.getElementById("app");
let S = null, timerId = null;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(t){ return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ox(v){ return v===true?"○":v===false?"×":"―"; }
function isCorrect(q,a){
  if(q.kind==="kk") return Array.isArray(a) && q.items.every((it,j)=>a[j]===it.ans);
  return a===q.ans;
}
function points(q){ return q.kind==="kk" ? 2 : 1; }
function answered(q,a){ return q.kind==="kk" ? Array.isArray(a) && a.every(v=>v===true||v===false) : (a===true||a===false); }
/* 間隔反復：box 0〜5、正解で次の間隔へ。不正解は当日中にもう一度。迷って正解は翌日 */
const DAY = 86400000, INTERVALS = [0,1,3,7,14,30];
function srsOf(id){ return store.srs[id] || null; }
function isMastered(id){ const r=srsOf(id); return !!r && r.b>=3; }
function isDue(id){ const r=srsOf(id); return !!r && r.d<=Date.now(); }
function record(q,ok,unsure,ms){
  const s=Object.assign({c:0,w:0,last:null},stat(q.id));
  const k0=streakOf(s);
  if(ok) s.c++; else s.w++; s.last = ok && !unsure;
  s.k = !ok ? 0 : unsure ? k0 : k0+1;                       // 連続正解
  s.at = Date.now();                                        // 最後に解いた時刻
  s.h = ((s.h||"")+(!ok?"0":unsure?"2":"1")).slice(-12);    // 直近の結果（0=×,1=○,2=迷って○）
  if(ms>0 && ms<120000) s.t = s.t ? Math.round(s.t*0.7+ms*0.3) : ms;   // 答えるまでの時間（平均）
  store.stats[q.id]=s;
  const r = Object.assign({b:0,d:0}, store.srs[q.id]||{});
  if(!ok){ r.b=0; r.d=Date.now(); }
  else if(unsure){ r.b=Math.min(r.b,1); r.d=Date.now()+DAY; }
  else { r.b=Math.min(r.b+1,5); r.d=Date.now()+INTERVALS[r.b]*DAY; }
  store.srs[q.id]=r;
}
function snapOf(id){ return {st: store.stats[id]?Object.assign({},store.stats[id]):null, sr: store.srs[id]?Object.assign({},store.srs[id]):null}; }
function restore(id,sn){ if(sn.st) store.stats[id]=sn.st; else delete store.stats[id]; if(sn.sr) store.srs[id]=sn.sr; else delete store.srs[id]; }

/* ===== 成績を横断的に見て出題の重みを決める =====
   苦手・まだ解いていない・復習の時期・苦手な分野・答えるのに時間がかかった問題を出やすく、
   覚えた問題・さっき解いたばかりの問題は出にくく */
function catRates(){
  const m={};
  tfEvery().concat(BANK_KK).forEach(q=>{ const s=store.stats[q.id]; if(!s) return; const c=q.kind==="kk"?"危険予測":q.cat; const o=m[c]||(m[c]={c:0,w:0}); o.c+=s.c; o.w+=s.w; });
  return m;
}
function catErr(m,c){ const o=m[c]; return o ? (o.w+0.5)/(o.c+o.w+2) : 0.25; }
function weightOf(q,m){
  const s=store.stats[q.id], now=Date.now();
  let w=1;
  if(!s) w+=1.5;
  else{
    if(isWeak(q.id)) w+=3+ (GRAD-streakOf(s))*0.5;
    if(isDue(q.id)) w+=1.5;
    if(s.t && s.t>9000) w+=0.5;
    if(s.h && s.h.slice(-3).includes("2")) w+=0.5;           // 最近迷った
    if(isMastered(q.id) && !isWeak(q.id)) w*=0.35;
    if(s.at && now-s.at<3600000) w*=0.3;                     // 1時間以内に解いた
  }
  w += catErr(m, q.kind==="kk"?"危険予測":q.cat)*2;
  return w;
}
/* 重みつきで順番を決める（重いほど前に来やすい。毎回ちがう並び） */
function smartOrder(pool){
  const m=catRates();
  return pool.map(q=>({q, k:Math.pow(Math.random(), 1/weightOf(q,m))})).sort((a,b)=>b.k-a.k).map(x=>x.q);
}
function smartPick(pool,n){ return smartOrder(pool).slice(0,n); }
function weakCats(){
  const m=catRates();
  return Object.entries(m).filter(([c,o])=>o.c+o.w>=5 && o.c/(o.c+o.w)<0.85).map(([c,o])=>({c, r:o.c/(o.c+o.w), n:o.c+o.w})).sort((a,b)=>a.r-b.r).slice(0,3);
}

/* ===== 出題開始 =====
   S.mode: "instant"（すぐ答えがわかる） / "batch"（全問解答） / "mock"（模擬試験＝全問解答＋合否） */
function prepKK(list){ return list.map(q=>q.kind==="kk"?Object.assign({},q,{items:shuffle(q.items.map((x,j)=>Object.assign({},x,{oi:j})))}):q); }
function blankAns(list){ return list.map(q=>q.kind==="kk"?[null,null,null]:null); }
function startSet(list,title){
  if(!list.length) return;
  list = prepKK(list);
  const mode = store.settings.answerMode==="batch" ? "batch" : "instant";
  S = {mode, title, list, i:0, ans:blankAns(list), checked:list.map(()=>false), unsure:list.map(()=>false), snap:list.map(()=>null), start:Date.now(), memo:null, spoken:""};
  render(); startTimer();
}
function startCompare(i){
  const g=COMPARE[i]; const list=compareList(g);
  if(!list.length) return;
  startSet(shuffle(list), "比較："+g.name); S.memo=g.memo; S.cmpIdx=i; render();
}
function startMock(type){
  let list, minutes, pass, title;
  if(type==="honmen"){
    list = shuffle(tfAll()).slice(0,90).concat(shuffle(BANK_KK).slice(0,5));
    minutes=50; pass=90; title="本免学科 模擬試験";
  }else{
    list = shuffle(tfAll()).slice(0,50); minutes=30; pass=45; title="仮免学科 模擬試験";
  }
  list = prepKK(list);
  const total = list.reduce((s,q)=>s+points(q),0);
  S = {mode:"mock", title, list, i:0, ans:blankAns(list), unsure:list.map(()=>false), start:Date.now(), spoken:"",
       end: store.settings.timeLimit ? Date.now()+minutes*60000 : null, pass, total};
  render(); startTimer();
}
const isBatch = ()=> S.mode==="batch" || S.mode==="mock";

/* ===== 描画 ===== */

  const q = S.list[S.i], n = S.list.length, a = S.ans[S.i];

  let body;
  if(q.kind==="tf"){

        <button class="ans x ${a===false?"sel":""}" ${done?"disabled":""} onclick="answerTF(false)">×</button>
      </div>
      ${done?`<div class="feedback ${a===q.ans?"ok":"ng"}"><b>${a===q.ans?"正解":"不正解"}</b>　正解は「${ox(q.ans)}」${weakNote(q)}</div>${explainTF(q)}${memoBox()}`:""}`;
  }else{
    body = `
      <div class="qhead"><span class="qcat">危険予測</span>${unsureBtn()}</div>

      <div class="sub">次の3つについて、正しいものは○、誤っているものは×を選んでください（3つとも正解で2点）。</div>
      ${q.items.map((it,j)=>`
        <div class="kk">
          <div class="kkq">(${j+1}) ${esc(it.q)}</div>
          <div class="kkbtn">
            <button class="mini o ${a[j]===true?"sel":""}" ${done?"disabled":""} onclick="setKK(${j},true)">○</button>
            <button class="mini x ${a[j]===false?"sel":""}" ${done?"disabled":""} onclick="setKK(${j},false)">×</button>
          </div>
          ${done?`<div class="kkfb ${a[j]===it.ans?"ok":"ng"}"><b>${a[j]===it.ans?"正解":"不正解"}</b>（正解は${ox(it.ans)}）${esc(it.exp)}</div>`:""}
        </div>`).join("")}
      ${done?`<div class="feedback ${isCorrect(q,a)?"ok":"ng"}"><b>${isCorrect(q,a)?"3つとも正解（2点）":"不正解（0点）"}</b>${weakNote(q)}</div>${explainKKTip(q)}${memoBox()}`:""}
      ${S.mode==="instant"&&!done?`<button class="btn center" ${answered(q,a)?"":"disabled"} onclick="checkKK()">答え合わせ</button>`:""}`;
  }
  const unans = isBatch() ? S.list.filter((qq,k)=>!answered(qq,S.ans[k])).length : 0;
  app.innerHTML = `
    <div class="topbar"><button class="link" onclick="quit()">← やめる</button>
      <span>${esc(S.title)}　${S.i+1} / ${n}</span><span class="tr">${canVoice()?`<button class="link spk" onclick="speakCurrent(true)" aria-label="読み上げ">🔊</button>`:""}<span id="timer"></span></span></div>
    <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
    <div class="card">${body}</div>
    ${isBatch() ? `
      <div class="row">
        <button class="btn ghost center" ${S.i?"":"disabled"} onclick="go(S.i-1)">前へ</button>
        <button class="btn ghost center" ${S.i<n-1?"":"disabled"} onclick="go(S.i+1)">次へ</button>
      </div>

        ${S.list.map((qq,k)=>`<button class="cell ${answered(qq,S.ans[k])?"filled":""} ${k===S.i?"cur":""}" onclick="go(${k})">${k+1}</button>`).join("")}
      </div></details>` : ""}
    ${done ? `<button class="btn center" onclick="next()">${S.i<n-1?"次の問題":"結果を見る"}</button>` : ""}
  `;
  tick();
  if(S.shownIdx!==S.i){ S.shownIdx=S.i; S.shownAt=Date.now(); idleArm(); }
  if(store.settings.tts) speakCurrent(false);
}
function weakNote(q){
  const sn=S.snap&&S.snap[S.i]; const was = sn&&sn.st ? (sn.st.w>0 && streakOf(sn.st)<GRAD) : false;
  if(was && !isWeak(q.id)) return `<div class="sub">🎉 苦手から卒業！</div>`;
  if(isWeak(q.id)) return `<div class="sub">苦手リスト：あと${weakLeft(q.id)}回つづけて正解で卒業</div>`;
  return "";
}
function unsureBtn(){
  const on = S.unsure && S.unsure[S.i];
  return `<button class="unsure ${on?"on":""}" onclick="toggleUnsure()">${on?"✓ 迷った":"迷った"}</button>`;
}
function memoBox(){ return S.memo?`<div class="exp cmpmemo"><div class="lbl">比較のポイント</div>${esc(S.memo)}</div>`:""; }
function toggleUnsure(){
  const k=S.i; S.unsure[k]=!S.unsure[k];
  if(S.mode==="instant" && S.checked[k] && S.snap[k]){
    const q=S.list[k]; restore(q.id,S.snap[k]); record(q,isCorrect(q,S.ans[k]),S.unsure[k]); save();
  }
  S.spoken = S.spoken; render();
}
function speakCurrent(force){
  const done = S.mode==="instant"&&S.checked[S.i];
  const key = S.i+":"+(done?"d":"q");
  if(!force && S.spoken===key) return;
  S.spoken = key;
  const q=S.list[S.i], a=S.ans[S.i];
  let items = q.kind==="tf" ? (done? itemsTFAnswer(q,a===q.ans) : itemsTFQuestion(q))
                            : (done? itemsKKAnswer(q,isCorrect(q,a)) : itemsKKQuestion(q));
  if(done && S.react && S.react.length){ items = S.react.concat(items.filter(x=>!/^r_(ok|ng|kk_ok)$/.test(x.clip||""))); }
  if(done) S.react=null;
  if(done && S.cmpIdx!=null && !S.memoSpoken){ S.memoSpoken=true; items=items.concat(itemsMemo(S.cmpIdx)); }
  playQueue(items);
}

/* ===== 操作 ===== */
function answerTF(v){
  const q = S.list[S.i]; S.ans[S.i]=v;
  if(S.mode==="instant"){ S.checked[S.i]=true; S.snap[S.i]=snapOf(q.id); record(q,v===q.ans,S.unsure[S.i],Date.now()-S.shownAt); save(); afterAnswer(q,v===q.ans); }
  else{ if(S.i<S.list.length-1) S.i++; render(); }
}
function setKK(j,v){ S.ans[S.i][j]=v; render(); }
function checkKK(){ const q=S.list[S.i], ok=isCorrect(q,S.ans[S.i]); S.checked[S.i]=true; S.snap[S.i]=snapOf(q.id); record(q,ok,S.unsure[S.i],Date.now()-S.shownAt); save(); afterAnswer(q,ok); }
/* ===== 正解・不正解の声かけ（設定でオン/オフ） =====
   毎回は言わない。間違えたとき・連続正解・リベンジ成功・苦手卒業は言いやすく、
   テンポよく答えているときは短い言葉だけ／控えめに */
const RX={streak:0, lastAns:0, lastSaid:-9, n:0, recent:[]};
/* 候補（グループ名 or クリップ名）から、最近使っていないものを選ぶ */
function flById(id){ for(const k in FL){ const x=FL[k].find(v=>v[0]===id); if(x) return x; } return null; }
function rxPick(...keys){
  let c=[]; keys.forEach(k=>{ if(FL[k]) c=c.concat(FL[k]); else { const x=flById(k); if(x) c.push(x); } });
  const fresh=c.filter(x=>!RX.recent.includes(x[0])); if(fresh.length) c=fresh;
  const x=c[Math.floor(Math.random()*c.length)];
  RX.recent.push(x[0]); if(RX.recent.length>14) RX.recent.shift();
  return {clip:x[0], text:x[1], react:true};
}
const P=p=>Math.random()<p;
/* 短い言葉（おっ／ありゃ／ふふ…）をときどき前につけて「おっ、即答だね。」のようにする */
const combo=(p,ij,phrase)=> P(p) ? [rxPick(ij), phrase] : [phrase];
const STREAK={3:["fl_rs3","fl_rsx3"],5:["fl_rs5","fl_rsx5"],10:["fl_rs10","fl_rsx10"],15:["fl_rs15","fl_rsx15"],20:["fl_rs20","fl_rsx20"],30:["fl_rs30","fl_rsx30"],50:["fl_rs50","fl_rsx50"]};
// ささやき系（寝る前の声）からも、合いそうなものを少しだけ混ぜる
const OK_SOFT=["fl_af6","fl_af8","fl_af4","fl_cp4","fl_cp8","fl_cp13"], NG_SOFT=["fl_af2","fl_af3","fl_af5","fl_af7","fl_hwa3"];
/* 生意気度：0=やさしめ／1=ちょっと生意気／2=生意気多め。生意気な言い方に置きかえる確率 */
function cheek(){ return [0,0.3,0.6,0.75,0.75][store.settings.cheeky??1]; }
/* 生意気グループ t○○ と 煽りグループ a○○ のどちらを使うか（煽り多めは煽りが中心） */
function tk(...gs){ const lv=store.settings.cheeky??1;
  return gs.map(g=>{ const b=g.slice(1);
    const z = FL["z"+b] && (lv>=4 ? P(0.6) : lv===3 ? P(0.2) : false);   // ざーこ系
    if(z) return "z"+b;
    return lv>=3 ? (P(0.75)?"a"+b:"t"+b) : lv===2 ? (P(0.3)?"a"+b:"t"+b) : "t"+b; }); }
const TZ=(t,...keys)=> P(cheek()) ? rxPick(...tk(t)) : rxPick(...keys);
function reactItems(q,ok){
  if(!store.settings.react || !canVoice()) return [];
  const now=Date.now(), quick=now-RX.lastAns<3000; RX.lastAns=now; RX.n++;
  const ms=now-(S.shownAt||now), fastAns=ms<2200, slowAns=ms>12000, unsure=!!S.unsure[S.i];
  const prevStreak=RX.streak; RX.streak = ok ? RX.streak+1 : 0;
  const sn=S.snap[S.i], wasWeak = sn&&sn.st ? (sn.st.w>0 && streakOf(sn.st)<GRAD) : false;
  const gap=RX.n-RX.lastSaid, said=(...x)=>{ RX.lastSaid=RX.n; return x; };
  const n=S.list.length, pos=S.i+1;
  const prog = n>=20 && pos===Math.floor(n/2) ? rxPick("rhf") : n>=20 && pos===n-3 ? rxPick("rnr") : null;
  // 必ず言う（大事な瞬間）
  const C=k=>P(coy()) ? [rxPick(k)] : null;                    // 思わせぶりな声
  if(ok && RX.streak>=5 && STREAK[RX.streak]){ const c=C("msk"); if(c) return said(...c); }
  if(ok && STREAK[RX.streak]) return said(...(RX.streak>=10&&P(cheek()) ? [rxPick(...tk("tsk"))] : combo(0.3,"isur",rxPick(...STREAK[RX.streak]))));
  if(ok && wasWeak && !isWeak(q.id)) return said(rxPick("rgrad"));
  if(!ok && prevStreak>=5) return said(...(P(cheek()*0.7) ? [rxPick(...tk("tng"))] : combo(0.4,"ioops",rxPick("rbrk"))));
  if(ok && wasWeak && P(0.7)) return said(...(C("mrv") || [TZ("trv","rrv")]));
  if(reacting()) return [];                                  // まだ前の声かけ中なら重ねない
  if(!ok){
    if(!P(quick?0.45:0.7)) return prog? said(prog) : [];
    { const c=C(fastAns&&P(0.6)?"mfw" : wasWeak&&P(0.6)?"mwk" : "mng"); if(c) return said(...c); }
    if(P(cheek())) return said(rxPick(...tk(fastAns&&P(0.6)?"tfw" : wasWeak&&P(0.6)?"twk" : "tng")));
    if(fastAns && P(0.6)) return said(...combo(0.4,"ioops",rxPick("rfastw")));
    if(wasWeak && P(0.5)) return said(...combo(0.3,"ioops",rxPick("rwr")));
    if(P(0.3)) return said(rxPick("ioops"));                    // 「ありゃ」「おっと」だけ
    return said(...combo(0.3,"ioops", P(0.2) ? rxPick(...NG_SOFT) : rxPick("rw","fl_chw1","fl_chw5")));
  }
  if((unsure||slowAns) && P(0.5)){ const c=C("mok"); if(c) return said(...c); }
  if(unsure && P(0.55)) return said(...(P(cheek()*0.5) ? [rxPick(...tk("tok"))] : combo(0.35,"ilaf",rxPick("runs"))));
  if(fastAns && gap>=2 && P(0.45)){
    { const c=C("mfo"); if(c) return said(...c); }
    if(P(cheek())) return said(rxPick(...tk("tfo","tok")));
    if(P(0.4)) return said(rxPick("isur"));                     // 「おぉー」「はやっ」だけ
    return said(...combo(0.35,"isur", isMastered(q.id)&&P(0.4) ? rxPick("fl_che1","fl_che4") : rxPick("rfast")));
  }
  if(slowAns && P(0.5)) return said(...(P(cheek()*0.5) ? [rxPick(...tk("tok"))] : combo(0.3,"ithk",rxPick("rslow"))));
  if(gap>=2 && P(quick?0.25:0.4)){
    if(!quick || P(0.5)){ const c=C("mok"); if(c) return said(...c); }   // テンポよく答えていても、ときどき
    if(P(cheek()*(quick?0.5:1))) return said(rxPick(...tk("tok")));
    if(quick || P(0.4)) return said(rxPick("ipos","ilaf","rq"));  // 短い言葉はテンポを崩さない
    return said(...combo(0.25,"ipos", P(0.15) ? rxPick(...OK_SOFT) : rxPick("rq","cp")));
  }
  return prog? said(prog) : [];
}
/* 答えずに考えこんでいるとき（15秒）、たまに「迷ってる？」 */
function idleArm(){
  clearTimeout(RX.idleT);
  if(!store.settings.react || !canVoice() || !S || S.mode!=="instant" || S.checked[S.i]) return;
  const k=S.i, sid=S.start;
  RX.idleT=setTimeout(()=>{
    if(!S || S.start!==sid || S.i!==k || S.checked[k] || AU.running) return;
    if(RX.n-(RX.lastIdle??-9)<3 || !P(0.6)) return;
    RX.lastIdle=RX.n; playQueue(P(coy())?[rxPick("mid")] : P(cheek())?[rxPick(...tk("tid"))] : P(0.4)?[rxPick("ithk")]:combo(0.3,"ithk",rxPick("ridle")));
  }, 15000);
}
function afterAnswer(q,ok){
  clearTimeout(RX.idleT);
  S.react = reactItems(q,ok);
  render();
  if(!store.settings.tts && S.react.length){ playQueue(S.react); S.react=null; }
}
function go(k){ S.i=Math.max(0,Math.min(S.list.length-1,k)); render(); window.scrollTo(0,0); }
function next(){ if(S.i<S.list.length-1){ S.i++; render(); window.scrollTo(0,0);} else { stopAudio(); result(); } }
function finishConfirm(){
  const un = S.list.filter((q,k)=>!answered(q,S.ans[k])).length;
  if(un && !confirm(`未回答が${un}問あります。採点しますか？`)) return;
  finishBatch();
}
function finishBatch(){
  stopTimer();
  S.list.forEach((q,k)=>record(q,isCorrect(q,S.ans[k]),S.unsure&&S.unsure[k]));
  save(); result();
}
function quit(){
  if(S && isBatch() && !confirm("中断しますか？（この回の成績は記録されません）")) return;
  if(S && S.mode==="instant" && S.checked.some(Boolean) && confirm("ここまでの結果を表示しますか？")) { result(); return; }
  stopAudio(); home();
}

/* ===== 結果 ===== */
let resultFilter = "wrong";
function resultVoice(score,total,pass){
  if(!store.settings.react || !canVoice() || !total) return;
  const r=score/total, items=[];
  if(S.mode==="mock"){
    const key=S.title, mb=(store.mockBest=store.mockBest||{})[key]||{};
    const th=S.pass/total;                                   // 合格ライン（本免90%・仮免90%）
    if(P(coy())) items.push(rxPick(pass?"mmp":"mmf"));
    else if(pass) items.push(r>=0.97 ? TZ("tmp","rmh") : r<th+0.02 ? rxPick("rmb") : TZ("tmp","rmp","rmh"));
    else items.push(r>=th-0.06 ? (P(cheek()*0.5) ? rxPick(...tk("tmf")) : rxPick("rmc")) : TZ("tmf","rmf"));
    if(mb.best!=null && score>mb.best) items.push({sil:1}, rxPick("fl_rmi2"));
    else if(mb.last!=null && score>mb.last) items.push({sil:1}, rxPick("fl_rmi1"));
    store.mockBest[key]={last:score, best:Math.max(score, mb.best??score)}; save();
  }else if(total>=5){
    items.push(P(coy()) ? rxPick("mpe") : r>=0.9 ? rxPick("rpg") : r>=0.7 ? rxPick("rpm") : rxPick("rpl"));
  }
  if(items.length){ items.forEach(x=>{ if(x.clip) x.react=true; }); RX.recent=RX.recent.slice(-6); stopAudio(); playQueue(items); }
}
function result(){
  stopTimer();
  S.elapsed = S.elapsed || Date.now()-S.start;
  const rows = S.list.map((q,k)=>({q,a:S.ans[k],ok:isCorrect(q,S.ans[k]),no:k+1,un:!!(S.unsure&&S.unsure[k])}));
  const done = S.mode==="instant" ? rows.filter((r,k)=>S.checked[k]) : rows;
  const score = done.reduce((s,r)=>s+(r.ok?points(r.q):0),0);
  const total = S.mode==="mock" ? S.total : done.reduce((s,r)=>s+points(r.q),0);
  const wrong = done.filter(r=>!r.ok);
  const unsureOk = done.filter(r=>r.ok&&r.un);
  const pass = S.mode==="mock" ? score>=S.pass : null;
  if(!S.voiced){ S.voiced=true; resultVoice(score,total,pass); }
  const kkRows = done.filter(r=>r.q.kind==="kk");
  const shown = resultFilter==="all" ? done : wrong;
  const mins = Math.floor(S.elapsed/60000), secs = Math.floor(S.elapsed%60000/1000);
  app.innerHTML = `
    <div class="topbar"><button class="link" onclick="home()">← ホーム</button><span>${esc(S.title)}</span><span></span></div>
    <div class="card center">
      <div class="big ${pass===null?"":pass?"pass":"fail"}">${score} / ${total}${S.mode==="mock"?"点":""}</div>
      <div>${pass===null?`正答率 ${total?Math.round(score/total*100):0}%`:pass?"合格ライン到達！":`不合格（合格は${S.pass}点以上）`}</div>
      ${kkRows.length&&S.mode==="mock"?`<div class="sub">文章問題 ${done.filter(r=>r.q.kind==="tf"&&r.ok).length}/${done.filter(r=>r.q.kind==="tf").length}問・危険予測 ${kkRows.filter(r=>r.ok).length}/${kkRows.length}題</div>`:""}
      <div class="sub">所要時間 ${mins}分${String(secs).padStart(2,"0")}秒${unsureOk.length?`・迷って正解 ${unsureOk.length}問（復習に回します）`:""}</div>
    </div>
    ${S.memo?`<div class="card"><div class="exp cmpmemo"><div class="lbl">比較のポイント</div>${esc(S.memo)}</div></div>`:""}
    ${wrong.length?`<button class="btn center" id="retry">間違えた${wrong.length}問をもう一度</button>`:""}
    <div class="seg small">
      <button class="${resultFilter==="wrong"?"on":""}" onclick="resultFilter='wrong';result()">間違えた問題（${wrong.length}）</button>
      <button class="${resultFilter==="all"?"on":""}" onclick="resultFilter='all';result()">全問の解説（${done.length}）</button>
    </div>
    <div class="card">${shown.map(reviewRow).join("") || "<div class='sub'>間違いはありません。全問正解です！</div>"}</div>
    <button class="btn ghost center" onclick="home()">ホームへ戻る</button>
  `;
  const rb = document.getElementById("retry");
  if(rb) rb.onclick = ()=>{ resultFilter="wrong"; startSet(shuffle(wrong.map(r=>r.q)),"間違えた問題"); };
}
function reviewRow(r){
  const q=r.q;
  if(q.kind==="tf") return `
    <div class="review"><div class="rhead"><span class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✗"}</span> <span class="sub">${r.no}.</span> <span class="qcat">${esc(q.cat)}</span>${q.hard?` <span class="qcat hard">意地悪</span>`:""}${r.un?` <span class="qcat">迷った</span>`:""}</div>
      ${q.sign?`<div class="sign small">${SIGNS[q.sign]}</div>`:""}
      <div>${esc(q.q)}</div>
      <div class="mark">正解：<span class="${q.ans?"pass":"fail"}">${ox(q.ans)}</span>　<span class="sub">あなた：${r.a===null?"未回答":ox(r.a)}</span></div>
      ${explainTF(q)}</div>`;
  return `
    <div class="review"><div class="rhead"><span class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✗"}</span> <span class="sub">${r.no}.</span> <span class="qcat">危険予測</span></div>
      <div>${esc(q.s)}</div>
      ${q.items.map((it,j)=>`<div class="kkrev"><span class="${r.a[j]===it.ans?"pass":"fail"}">${r.a[j]===it.ans?"✓":"✗"}</span> (${j+1}) ${esc(it.q)}<br><span class="sub">正解：${ox(it.ans)}／あなた：${ox(r.a[j])}　${esc(it.exp)}</span></div>`).join("")}
      ${explainKKTip(q)}
    </div>`;
}

/* ===== 数字暗記カード ===== */
let F = null;
function startFlash(onlyNew){
  stopTimer(); S=null;
  let idx = FLASH.map((f,i)=>i); if(onlyNew) idx = idx.filter(i=>!store.flash[i]);
  if(!idx.length) return;
  F = {queue: shuffle(idx), shown:false, done:0, total:idx.length};
  renderFlash();
}
function renderFlash(){
  if(!F.queue.length){
    app.innerHTML = `<div class="topbar"><button class="link" onclick="stopAudio();home()">← ホーム</button><span>数字暗記カード</span><span></span></div>
      <div class="card center"><div class="big pass">完了</div><div>${F.total}枚すべて「覚えた」になりました。</div></div>
      <button class="btn ghost center" onclick="stopAudio();home()">ホームへ戻る</button>`;
    return;
  }
  const i=F.queue[0], f=FLASH[i];
  app.innerHTML = `
    <div class="topbar"><button class="link" onclick="stopAudio();home()">← やめる</button><span>覚えた ${F.done} / ${F.total}</span><span class="tr">${canVoice()?`<button class="link spk" onclick="speakFlash()">🔊</button>`:""}</span></div>
    <div class="bar"><i style="width:${F.done/F.total*100}%"></i></div>
    <div class="card flash" onclick="flipFlash()">
      <span class="qcat">${esc(f[0])}</span>
      <div class="ffront">${esc(f[1])}</div>
      ${F.shown?`<div class="fback">${esc(f[2])}</div>`:`<div class="sub center">タップして答えを見る</div>`}
    </div>
    ${F.shown?`<div class="row">
      <button class="btn ghost center" onclick="flashAgain()">もう一度</button>
      <button class="btn center" onclick="flashOK()">覚えた</button></div>`:""}`;
  if(store.settings.tts) speakFlash();
}
function speakFlash(){ const i=F.queue[0]; playQueue(F.shown? itemsFlashBack(i) : itemsFlashFront(i)); }
function flipFlash(){ if(!F.shown){ F.shown=true; renderFlash(); } }
function flashOK(){ const i=F.queue.shift(); store.flash[i]=true; save(); F.done++; F.shown=false; renderFlash(); }
function flashAgain(){ const i=F.queue.shift(); store.flash[i]=false; save(); F.queue.splice(Math.min(3,F.queue.length),0,i); F.shown=false; renderFlash(); }

/* ===== タイマー（制限時間なしのときは経過時間を表示） ===== */
function startTimer(){ stopTimer(); timerId=setInterval(tick,1000); }
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function fmt(ms){ const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return `${m}:${String(s).padStart(2,"0")}`; }
function tick(){
  const el = document.getElementById("timer");
  if(!el || !S) return;
  if(S.end){
    const left = Math.max(0, S.end-Date.now());
    el.textContent = `残り ${fmt(left)}`;
    el.className = left<5*60000 ? "warn" : "";
    if(left<=0){ stopTimer(); alert("時間切れです。採点します。"); finishBatch(); }
  }else{
    el.textContent = `経過 ${fmt(Date.now()-S.start)}`;
  }
}

/* ===== 問題追加・リセット ===== */
function importQ(){
  const lines = document.getElementById("imp").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let added=0, bad=0;
  lines.forEach((l,k)=>{
    const p = l.split(/[|｜]/);
    const m = (p[0]||"").trim();
    const ans = /^(○|〇|◯|o|O|true|1)$/.test(m) ? true : /^(×|✕|x|X|false|0)$/.test(m) ? false : null;
    if(ans===null || !p[1] || !p[1].trim()){ bad++; return; }
    store.custom.push({id:"u"+Date.now()+"_"+k, cat:"追加問題", ans, q:p[1].trim(), exp:(p.slice(2).join("|")||"").trim()});
    added++;
  });
  save(); home();
  document.getElementById("impMsg").textContent = `${added}問追加しました${bad?`（読み込めなかった行：${bad}）`:""}。追加済み：${store.custom.length}問`;
}
function clearCustom(){ if(confirm("追加した問題をすべて削除しますか？")){ store.custom=[]; save(); home(); } }
function resetStats(){ if(confirm("成績（復習の予定・暗記カードの記録を含む）をすべてリセットしますか？")){ store.stats={}; store.srs={}; store.flash={}; save(); home(); } }

home();

</script>
