<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="学科対策">
<meta name="theme-color" content="#1f6feb">
<title>学科試験対策</title>
<style>
:root{
  --bg:#f4f6fa; --card:#ffffff; --text:#1b1f27; --sub:#6b7280; --line:#e3e7ee;
  --accent:#1f6feb; --ok:#14965a; --ng:#d6334a; --okbg:#e6f6ee; --ngbg:#fde9ec; --chip:#eef2f8; --warn:#c2410c; --trapbg:#fff4e5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e8ebf1; --sub:#9aa3b2; --line:#2a303b;
    --accent:#4c8dff; --ok:#3ccf8e; --ng:#ff6b7f; --okbg:#12301f; --ngbg:#3a1820; --chip:#222834; --warn:#fbbf24; --trapbg:#33270f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
h2{font-size:17px;margin:22px 0 6px}
.tag{font-size:12px;font-weight:600;background:var(--chip);color:var(--sub);border-radius:6px;padding:2px 8px;vertical-align:middle}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.center{text-align:center !important}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.stats span{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:600;
  background:var(--accent);color:#fff;margin:8px 0;text-align:left;cursor:pointer;font-family:inherit}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.85}
.btn.ghost{background:var(--chip);color:var(--text)}
.btn:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--text);border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
#timer.warn{color:var(--warn);font-weight:700}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qcat{display:inline-block;font-size:12px;background:var(--chip);border-radius:6px;padding:2px 8px;color:var(--sub)}
.qtext{font-size:18px;margin:12px 0 4px;min-height:4.5em}
.sign{display:flex;justify-content:center;margin:12px 0 0}
.sign svg{width:auto;height:130px;max-width:85%}
.sign.small svg{height:70px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.ans{border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:16px;font-size:44px;font-weight:700;
  padding:18px 0;cursor:pointer;font-family:inherit}
.ans.o,.mini.o{color:var(--ok)} .ans.x,.mini.x{color:var(--ng)}
.ans.sel,.mini.sel{border-color:var(--accent);background:var(--chip)}
.scene{font-size:16px;margin:10px 0;padding:12px;border-left:4px solid var(--accent);background:var(--chip);border-radius:8px}
.kk{border-top:1px solid var(--line);padding:12px 0}
.kkq{font-size:16px}
.kkbtn{display:flex;gap:10px;margin-top:8px}
.mini{flex:1;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:26px;font-weight:700;padding:6px 0;cursor:pointer;font-family:inherit}
.kkfb{font-size:13px;margin-top:6px;padding:8px 10px;border-radius:8px}
.kkfb.ok,.feedback.ok{background:var(--okbg)} .kkfb.ng,.feedback.ng{background:var(--ngbg)}
.feedback{border-radius:12px;padding:12px 14px;margin-top:12px}
.feedback b{font-size:17px}
.feedback.ok b{color:var(--ok)} .feedback.ng b{color:var(--ng)}
.link{background:none;border:none;color:var(--accent);font-size:14px;padding:4px 0;cursor:pointer;font-family:inherit}
.big{font-size:44px;font-weight:800;margin:8px 0 0}
.pass{color:var(--ok)} .fail{color:var(--ng)}
.review{border-top:1px solid var(--line);padding:12px 0}
.review:first-child{border-top:none}
.review .mark{font-weight:700}
.kkrev{margin-top:8px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;
  background:var(--bg);color:var(--text);font-family:inherit}
.row{display:flex;gap:8px}
details summary{cursor:pointer;font-size:14px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:10px}
.cell{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 0;font-size:13px;font-family:inherit}
.cell.filled{background:var(--chip);color:var(--sub)}
.cell.cur{border-color:var(--accent);border-width:2px;color:var(--text)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin:8px 0}
.seg button{border:none;background:transparent;color:var(--sub);border-radius:9px;padding:10px 6px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.seg button small{display:block;font-size:11px;font-weight:400}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.small button{font-size:13px;padding:8px 4px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:6px 2px}
.toggle input{width:20px;height:20px}
.exp{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:14px}
.exp .lbl{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px}
.exp.trap{background:var(--trapbg)}
.exp.trap .lbl{color:var(--warn)}
.rhead{margin-bottom:4px}
.memo table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.memo th{text-align:left;padding:8px 4px 4px;color:var(--accent);font-size:13px}
.memo td{padding:5px 4px;border-top:1px solid var(--line)}
.memo td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.memo ul{padding-left:20px;font-size:14px;margin:12px 0 0}
.memo li{margin:4px 0}
.qcat.hard{background:var(--trapbg);color:var(--warn);font-weight:700}
.toggle.strong{color:var(--text);font-weight:600;margin-top:12px}
.hardbtn{border:2px solid var(--warn)}
.kouka{border:2px solid var(--accent)}
.sign svg.wide{height:80px}.sign.small svg.wide{height:44px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== 文章問題 [分野, 正解(true=○), 問題文, 解説, 標識キー(任意)] ===== */
const TF = [
// ---------- 信号・合図 ----------
["信号・合図",true,"黄色の灯火信号では、停止位置で安全に停止できない場合を除き、停止位置から先へ進んではならない。","黄信号は「止まれ」が原則。急ブレーキになるなど安全に止まれない場合だけそのまま進めます。"],
["信号・合図",false,"黄色の灯火信号に変わったとき、すでに交差点内に入っている車は、その場で停止しなければならない。","すでに交差点内にいる車は、そのまま速やかに交差点の外へ出ます。"],
["信号・合図",true,"右向きの青色の矢印信号では、自動車は右折だけでなく転回もできる。","右向き矢印では右折・転回ができます（軽車両や二段階右折の原付は除く）。"],
["信号・合図",true,"赤色の灯火信号であっても、青色の左向きの矢印が表示されていれば、車は左折することができる。","矢印の方向へは、赤信号でも進めます。"],
["信号・合図",true,"赤色の灯火信号に変わったとき、交差点内ですでに右折している車は、そのまま進むことができる。","ただし青信号で進行する車の進行を妨げてはいけません。"],
["信号・合図",false,"赤色の灯火の点滅信号では、徐行して交差点に進入することができる。","赤の点滅は「一時停止」。停止位置で一時停止し、安全を確かめてから進みます。"],
["信号・合図",true,"黄色の灯火の点滅信号では、他の交通に注意して進むことができる。","黄の点滅は一時停止不要。他の交通に注意して進めます。"],
["信号・合図",true,"警察官が両腕を水平に上げているとき、その身体の正面に対面する交通は赤色の灯火信号と同じ意味である。","正面・背面に対面する交通は赤、平行する交通は青と同じ意味です。"],
["信号・合図",true,"警察官が腕を垂直に上げているとき、その身体に平行する交通は黄色の灯火信号と同じ意味である。","身体に対面する交通は赤、平行する交通は黄です。"],
["信号・合図",false,"警察官が灯火を頭上に上げているとき、その身体の正面に対面する交通は黄色の灯火信号と同じ意味である。","灯火を頭上に上げているとき、対面する交通は赤、平行する交通は黄です。"],
["信号・合図",true,"警察官が灯火を横に振っているとき、振られている方向に進行する交通は青色の灯火信号と同じ意味である。","振られている方向に対面する交通は赤です。"],
["信号・合図",false,"信号機の信号と警察官の手信号が異なるときは、信号機の信号に従わなければならない。","警察官や交通巡視員の手信号・灯火信号が優先です。"],
["信号・合図",true,"青信号であっても、前方の交通が混雑していて交差点内で停止するおそれがあるときは、交差点に入ってはならない。","交差点内で止まって他の交通を妨げるおそれがあるときは進入禁止です。"],
["信号・合図",true,"右左折の合図は、右左折しようとする地点（交差点ではその手前の側端）から30メートル手前に達したときに行う。","進路変更の合図はその約3秒前です。"],
["信号・合図",false,"進路変更の合図は、進路を変えようとする約30メートル手前で行う。","進路変更の合図は「約3秒前」。30メートル手前は右左折・転回の合図です。"],
["信号・合図",true,"右左折や進路変更などの合図は、その行為が終わったら速やかにやめなければならない。","合図を出したままにすると、他の交通に誤解を与えます。"],
["信号・合図",true,"手による右折の合図は、右腕を車の右側の外に出して水平に伸ばすか、左腕のひじを垂直に上に曲げて行う。","左折の合図は、左腕を水平に伸ばすか、右腕のひじを垂直に上に曲げます。"],
["信号・合図",true,"「警笛鳴らせ」の標識がある場所では、警音器を鳴らさなければならない。","それ以外の場所では、危険を避けるためやむを得ない場合を除き、警音器を鳴らしてはいけません。"],
["信号・合図",false,"見通しのきかない交差点を通行するときは、必ず警音器を鳴らさなければならない。","警音器を鳴らすのは「警笛鳴らせ」の標識の場所や警笛区間内の見通しのきかない交差点などに限られます。"],
// ---------- 標識・標示 ----------
["標識・標示",true,"この標識がある交差点では、停止線があればその直前で一時停止しなければならない。","「一時停止」の標識。停止線がない場合は交差点の直前で一時停止します。","tomare"],
["標識・標示",true,"この標識のある場所では、車はすぐに停止できるような速度で進行しなければならない。","「徐行」の標識です。","jokou"],
["標識・標示",false,"この標識のある場所では、駐車も停車もしてはならない。","「駐車禁止」の標識。停車はできます。","chusha"],
["標識・標示",true,"この標識のある場所でも、5分以内の荷物の積みおろしのための停止はすることができる。","「駐車禁止」の標識。5分以内の荷物の積みおろしは停車にあたるのでできます。","chusha"],
["標識・標示",true,"この標識のある場所では、駐車も停車も禁止されている。","「駐停車禁止」の標識です。","chuteisha"],
["標識・標示",true,"この標識は、車がこの標識のある方向から進入することを禁止している。","「車両進入禁止」の標識。反対方向からは通行できます。","shinnyu"],
["標識・標示",false,"この標識は、車だけでなく歩行者の進入も禁止している。","「車両進入禁止」は車の進入を禁止するもので、歩行者は対象外です。","shinnyu"],
["標識・標示",true,"この標識のある道路は、自動車だけでなく原動機付自転車や自転車などの軽車両も通行できない。","「車両通行止め」の標識。車両には軽車両も含まれます。","sharyodome"],
["標識・標示",true,"この標識のある道路では、自動車は時速50キロメートルを超えて運転してはならない。","「最高速度」の標識です。","max50"],
["標識・標示",false,"この標識は、最低速度が時速50キロメートルであることを示している。","これは「最高速度」の標識。最低速度の標識は、同じ白地・赤い輪で数字の下に線（下線）があります。","max50"],
["標識・標示",true,"この標識のある交差点では、右折することはできない。","「指定方向外進行禁止」の標識。矢印の方向（直進・左折）以外には進めません。","shitei"],
["標識・標示",true,"この標識は、車が矢印の方向にしか進めない一方通行を示している。","「一方通行」の標識です。","ippou"],
["標識・標示",true,"補助標識で規制の時間が示されている場合、その時間以外は本標識の規制は適用されない。","補助標識は本標識の規制の日時・区間・車種などを限定します。"],
["標識・標示",true,"警戒標識は、道路上の危険や注意すべき状況を前もって知らせ、注意を促すものである。","黄色のひし形の標識が警戒標識です。"],
["標識・標示",true,"車両通行帯の境界線が黄色の線で示されているときは、その黄色の線を越えて進路変更してはならない。","黄色の線は進路変更禁止。白の破線側からは変更できます。"],
["標識・標示",true,"道路の中央に引かれた白の破線は、追い越しのため道路の右側部分にはみ出して通行してもよいことを示している。","ただし反対方向の交通を妨げないことが前提です。"],
["標識・標示",false,"路線バス等優先通行帯は、路線バス等以外の自動車は通行することができない。","普通自動車も通行できますが、路線バス等が近づいたら速やかに出ます。混雑で出られなくなるおそれがあるときは初めから通行しません。"],
["標識・標示",false,"路線バス等の専用通行帯は、普通乗用自動車であっても路線バス等が来ていなければ通行してよい。","専用通行帯は、指定された車以外は通行できません（右左折・工事などやむを得ない場合を除く）。"],
["標識・標示",true,"「立入り禁止部分」の標示がある場所には、車は入ってはならない。","安全地帯にも入ってはいけません。"],
// ---------- 通行方法 ----------
["通行方法",true,"車は、道路の中央から左の部分を通行しなければならない。","左側通行が原則です。"],
["通行方法",true,"一方通行の道路では、道路の中央から右の部分にはみ出して通行することができる。","一方通行路では右側部分も通行できます。"],
["通行方法",true,"道路の左側部分の幅が6メートル未満の見通しのよい道路で他の車を追い越すときは、標識などで禁止されていなければ、道路の右側部分にはみ出して通行できる。","ただし反対方向の交通を妨げてはいけません。"],
["通行方法",true,"車両通行帯が片側2つの道路では、原則として左側の通行帯を通行し、右側の通行帯は追い越しなどのためにあけておく。","片側3つ以上では、速度の遅い車が左側、速い車が順次右側を通行します。"],
["通行方法",true,"車両通行帯のある道路では、みだりに進路を変更してはならない。","進路変更を繰り返すと事故の原因になります。"],
["通行方法",true,"進路を変更すると、後方から来る車が急ブレーキや急ハンドルで避けなければならなくなるような場合は、進路を変更してはならない。","後方の安全を確かめてから進路変更します。"],
["通行方法",true,"歩道や路側帯、自転車道は、道路に面した場所に出入りするため横切る場合などを除き、車は通行してはならない。","横切る場合は歩行者の有無にかかわらず直前で一時停止します。"],
["通行方法",true,"歩道や路側帯を横切るときは、歩行者がいなくても、その直前で一時停止しなければならない。","歩行者の有無に関係なく一時停止です。"],
["通行方法",true,"軌道敷内は、右左折や横断、転回のため横切る場合や、危険防止のためやむを得ない場合などを除き、通行してはならない。","「軌道敷内通行可」の標識がある場合などは通行できます。"],
["通行方法",false,"「転回禁止」の標識がない道路であれば、どこでも転回してよい。","他の交通を妨げるおそれがあるときは、標識がなくても転回してはいけません。"],
["通行方法",true,"道路工事や障害物などでやむを得ない場合は、黄色の中央線（追い越しのための右側部分はみ出し通行禁止）があっても、はみ出して通行できる。","左側部分だけで通行するのに十分な幅がないときなどは、はみ出して通行できます。"],
["通行方法",true,"路線バス等が停留所で発進の合図をしたときは、急ブレーキや急ハンドルで避けなければならない場合を除き、その発進を妨げてはならない。","後方の車はバスの発進を優先させます。"],
// ---------- 速度・車間距離 ----------
["速度・車間距離",true,"中央線や車両通行帯がある一般道路で、標識などによる指定がない場合、普通自動車の法定速度は時速60キロメートルである。","中央線・車両通行帯・中央分離帯がある一般道路は引き続き60km/hです。"],
["速度・車間距離",true,"中央線や車両通行帯のない一般道路（生活道路）では、標識などで指定がなければ自動車の法定速度は時速30キロメートルである。","2026年9月1日施行の改正で、生活道路の法定速度が60km/hから30km/hに引き下げられました。"],
["速度・車間距離",false,"中央線のない一般道路でも、最高速度の標識がなければ普通自動車は時速60キロメートルで走行できる。","2026年9月1日から、中央線や車両通行帯のない一般道路の法定速度は30km/hです。"],
["速度・車間距離",true,"最高速度の標識がある道路では、生活道路であっても標識が示す速度が最高速度となる。","標識・標示で指定されている場合は、その指定速度に従います。"],
["速度・車間距離",true,"徐行とは、車がすぐに停止できるような速度で進行することをいう。","目安はおおむね時速10キロメートル以下とされています。"],

{k:1,c:"AT車の運転",a:true,q:"AT車のセレクトレバーがPかNの位置にないと、エンジンは始動しない。",e:"誤って発進しないよう、PかNでないとエンジンがかからない仕組みになっています。",t:"Nでもかかるが、Pで始動するのが基本。"},
{k:1,c:"AT車の運転",a:false,q:"長い下り坂では、セレクトレバーをDに入れたまま、フットブレーキだけで速度を調節するのがよい。",e:"2やLに入れてエンジンブレーキを使い、フットブレーキは補助的に使います。フットブレーキだけだとフェード現象などの原因になります。",t:"下り坂はエンジンブレーキが主役。"},
{k:1,c:"AT車の運転",a:false,q:"長い下り坂では、燃料を節約するため、セレクトレバーをNに入れて走るとよい。",e:"Nに入れるとエンジンブレーキが効かず、危険です。",t:"「燃料節約」はもっともらしい理由づけのひっかけ。"},
{k:1,h:1,c:"AT車の運転",a:false,q:"速度が出ているときに減速したいときは、セレクトレバーをDから一気にLに入れて強いエンジンブレーキをかけるのがよい。",e:"高い速度で一気にLに入れると急激に減速し、スリップや後続車の追突の原因になります。2を経由するなど段階的にします。",t:"「エンジンブレーキ＝いつでも安全」ではない。"},
{k:1,c:"AT車の運転",a:true,q:"上り坂で速度が落ちてきたときは、セレクトレバーを2やLに入れると、力強く上ることができる。",e:"低いレンジほど力が大きくなります。",t:"Lは下り坂だけのものではない。"},
{k:1,c:"AT車の運転",a:false,q:"AT車は、上り坂で停止しているときにブレーキペダルから足を離しても、後ろに下がることはない。",e:"急な上り坂では、クリープ現象より坂の力が勝って後退することがあります。",t:"「AT車は下がらない」という思い込みのひっかけ。"},
{k:1,c:"AT車の運転",a:true,q:"運転を始める前に、ブレーキペダルとアクセルペダルの位置を、実際に足で踏んで確かめておく。",e:"ペダルの踏み間違いを防ぎます。",t:"当たり前の内容を×と疑わないこと。"},
{k:1,c:"AT車の運転",a:true,q:"雪道でAT車を発進させるときは、クリープ現象を利用してじわりと発進し、アクセルペダルを急に踏み込まない。",e:"アクセルを踏みすぎるとタイヤが空転して、さらに滑りやすくなります。",t:"MT車は2速発進、AT車はクリープ利用。"},
{k:1,c:"AT車の運転",a:false,q:"雪道でAT車を発進させるときは、タイヤが雪に負けないよう、アクセルペダルを強く踏み込んで一気に発進する。",e:"クリープ現象を利用して、じわりと発進します。",t:"「一気に」「強く」は×の定番。"},
{k:1,c:"AT車の運転",a:true,q:"AT限定の普通免許では、クラッチペダルのある普通自動車を運転することはできない。",e:"AT限定免許で運転できるのは、クラッチ操作のない（AT）車だけです。",t:"MT車を運転すると免許条件違反。"},
{k:1,c:"AT車の運転",a:false,q:"AT限定の普通免許を受けていれば、クラッチ操作のない車であれば大型自動車でも運転することができる。",e:"運転できる車の種類は免許の種類で決まります。普通免許で大型自動車は運転できません。",t:"AT限定は「普通免許の範囲内のAT車」。"},
// ---------- MT車の運転 ----------
{k:1,c:"MT車の運転",a:true,q:"MT車の発進は、クラッチペダルを踏んでローギアに入れ、半クラッチの状態でアクセルペダルを踏みながら静かに発進する。",e:"MT車の発進の基本手順です。",t:"当たり前の内容を×と疑わないこと。"},
{k:1,c:"MT車の運転",a:false,q:"MT車の発進では、エンストを防ぐため、アクセルペダルを強く踏み込んでから一気にクラッチをつなぐ。",e:"急にクラッチをつなぐと急発進になります。半クラッチで静かにつなぎます。",t:"「エンスト防止」をもっともらしい理由にしたひっかけ。"},
{k:1,c:"MT車の運転",a:true,q:"上り坂で発進するときは、パーキングブレーキを利用すると、後退せずに発進しやすい。",e:"坂道発進ではパーキングブレーキを使います。",t:"パーキングブレーキの利用は正しい方法。"},
{k:1,c:"MT車の運転",a:true,q:"変速は車の速度に合わせて行う。低速ギアほど力は大きく、速度は遅い。",e:"発進や上り坂では低速ギア、速度が上がったら高速ギアを使います。",t:"「高速ギアほど力が大きい」と逆にした×問題に注意。"},
{k:1,c:"MT車の運転",a:false,q:"高速ギアほど力が大きいので、急な上り坂では高速ギアを使うとよい。",e:"力が大きいのは低速ギアです。",t:"力と速度の関係を逆にしたひっかけ。"},
{k:1,c:"MT車の運転",a:true,q:"長い下り坂では、ギアを段階的に低速ギアへ落とし、エンジンブレーキを活用する。",e:"フットブレーキは補助的に使います。一気に低いギアへ落とすのは避けます。",t:"「段階的に」がポイント。"},
{k:1,c:"MT車の運転",a:false,q:"下り坂では、ギアをニュートラルにして惰性で走ると、ブレーキの負担が減って安全である。",e:"ニュートラルではエンジンブレーキが効かず、フットブレーキの負担がかえって大きくなります。",t:"AT車のNと同じ理屈。"},
{k:1,c:"MT車の運転",a:true,q:"MT車で停止するときは、エンストしないよう、停止する直前にクラッチペダルを踏む。",e:"早く踏みすぎるとエンジンブレーキが効かなくなるので、停止の直前に踏みます。",t:"クラッチを踏むタイミングの問題。"},
{k:1,c:"MT車の運転",a:false,q:"MT車で走行中は、すぐに操作できるよう、常にクラッチペダルに左足を乗せておく。",e:"クラッチペダルに足を乗せたままにすると、半クラッチの状態になってクラッチを傷めます。",t:"「すぐに操作できるよう」はもっともらしい理由づけ。"},
{k:1,c:"MT車の運転",a:false,q:"カーブの途中でクラッチを切ると、車が安定して曲がりやすくなる。",e:"カーブの中でクラッチを切るとエンジンブレーキが効かず不安定になります。カーブの手前で減速・シフトダウンを済ませます。",t:"「安定する」と正反対の結果を書いたひっかけ。"},
{k:1,c:"MT車の運転",a:true,q:"カーブの手前では、十分に速度を落とし、必要に応じてシフトダウンしておく。",e:"カーブの中での変速やブレーキは避けます。",t:"減速と変速は「手前」で。"},
{k:1,c:"MT車の運転",a:false,q:"高い速度のまま一気にローギアに入れると、強いエンジンブレーキが効くので安全に減速できる。",e:"高い速度で急にシフトダウンすると、エンジンを傷めたり、タイヤがスリップしたりします。順にシフトダウンします。",t:"段階的にシフトダウンするのが正しい。"},
{k:1,c:"MT車の運転",a:true,q:"雪道での発進は、セカンドギアで静かに発進すると、タイヤが空転しにくい。",e:"駆動力が穏やかになり、空転を防げます。",t:"雪道の発進は「低速ギアで力強く」ではない。"},
{k:1,c:"MT車の運転",a:false,q:"MT車で後退するときは、車が完全に止まる前にリバースギアに入れると、すばやく後退できる。",e:"リバースギアは、車が完全に止まってから入れます。",t:"「すばやく」がひっかけ。"},
{k:1,c:"MT車の運転",a:false,q:"MT車で坂道に駐車するときは、上り坂ではバック、下り坂ではローにギアを入れておく。",e:"上り坂ではロー、下り坂ではバックに入れます。",t:"上り・下りの入れ替え。",h:1},
{k:1,c:"MT車の運転",a:true,q:"半クラッチを長く使いすぎると、クラッチを傷める原因になる。",e:"発進のとき以外は、必要以上に半クラッチを使いません。",t:"半クラッチの使いすぎは×。"},
// ---------- 二輪車の運転 ----------
{k:1,c:"二輪車の運転",a:false,q:"二輪車でブレーキをかけると体が前のめりになるので、後ろにのけぞるような姿勢でブレーキをかけるとよい。",e:"のけぞらず、ニーグリップをして正しい姿勢を保ったままブレーキをかけます。",t:"「前のめりになるから逆にのけぞる」はもっともらしいが誤り。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車でブレーキをかけるときは、ニーグリップをしっかりして、体が前にずれないよう正しい姿勢を保つ。",e:"正しい姿勢でブレーキをかけると、車体が安定します。",t:"のけぞる・前に乗り出すは×。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車のブレーキは、前輪ブレーキと後輪ブレーキを同時にかけるのが基本である。",e:"エンジンブレーキも合わせて使います。",t:"片方だけは×。"},
{k:1,c:"二輪車の運転",a:false,q:"二輪車でブレーキをかけるときは、転倒を防ぐため、後輪ブレーキだけを使うのが安全である。",e:"前輪・後輪のブレーキを同時にかけます。",t:"「転倒を防ぐため」はもっともらしい理由づけ。"},
{k:1,c:"二輪車の運転",a:true,q:"乾燥した舗装路では前輪ブレーキをやや強く、路面が滑りやすいときは後輪ブレーキをやや強くかける。",e:"路面の状況によって前後の配分を変えます。",t:"乾燥＝前輪強め、滑りやすい＝後輪強め。入れ替えに注意。"},
{k:1,c:"二輪車の運転",a:false,q:"雨で路面が濡れているときは、前輪ブレーキを強めにかけると安定して止まれる。",e:"滑りやすい路面では、後輪ブレーキをやや強くかけます。前輪を強くかけると転倒しやすくなります。",t:"乾燥路面のルールを濡れた路面に当てはめたひっかけ。"},
{k:1,c:"二輪車の運転",a:false,q:"二輪車のブレーキは、一度に強くかけるのがよい。",e:"ブレーキは数回に分けてかけます。後続車への合図にもなります。",t:"「一度に強く」は×。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車でカーブを曲がるときは、カーブの手前の直線部分で十分に速度を落とし、カーブの途中ではクラッチを切らずに、スロットルで速度を加減する。",e:"カーブに入ってからブレーキをかけないよう、手前で減速します。カーブの後半で前方の安全を確かめてから徐々に加速します。",t:"減速は「手前」で、途中は「スロットルで加減」。悪路の「スロットルで一定」と言い回しが違うので注意。"},
{k:1,c:"二輪車の運転",a:false,q:"二輪車でカーブを曲がるときは、カーブの途中でクラッチを切り、惰性で曲がるとよい。",e:"カーブの途中ではクラッチを切らず、エンジンの力を伝えたままスロットルで速度を加減します。",t:"クラッチを切って惰性で走るのは×。"},
{k:1,c:"二輪車の運転",a:false,q:"ぬかるみや砂利道では、ブレーキやスロットルを使い分けて、速度を変化させながら通過する。",e:"ぬかるみや砂利道では、ブレーキや大きなハンドル操作を避け、スロットルで速度を一定に保って通過します。",t:"悪路は「一定」。「変化させながら」が×のポイント。"},
{k:1,c:"二輪車の運転",a:false,q:"カーブの途中で速度が出すぎたと感じたときは、すぐに強いブレーキをかける。",e:"カーブの途中で強いブレーキをかけると横滑りして転倒するおそれがあります。手前で十分に減速します。",t:"とっさの急ブレーキは×。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車でカーブを曲がるときは、ハンドルを切るのではなく、車体を傾けることによって自然に曲がるようにする。",e:"二輪車は車体を傾けて曲がります。",t:"四輪車の曲がり方と区別する。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車でカーブを曲がるときは、視線をカーブの先の方に向ける。",e:"視線を先に向けると、進路が安定します。",t:"足元や前輪を見るのは×。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車に乗るときは、ステップに土踏まずを乗せ、つま先を前方に向け、タンクを両ひざで締める（ニーグリップ）。",e:"正しい乗車姿勢です。",t:"つま先を外に開くのは×。"},
{k:1,c:"二輪車の運転",a:false,q:"二輪車に乗るときは、ひじを伸ばしてハンドルグリップを強く握り、上体を突っ張るようにする。",e:"ひじを軽く曲げ、ハンドルグリップは軽く握り、上体の力を抜きます。",t:"「強く」「突っ張る」がひっかけ。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車を選ぶときは、またがったときに両足のつま先が地面に届くものを選ぶ。",e:"体格に合った車種を選びます。",t:"「両足」がポイント。"},
{k:1,c:"二輪車の運転",a:false,q:"二輪車を選ぶときは、またがったときに片足のつま先が地面に届けば、体格に合っているといえる。",e:"両足のつま先が地面に届くものを選びます。",t:"「片足」がひっかけ。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車に乗るときは、PS(c)マークかJISマークの付いた乗車用ヘルメットをかぶる。",e:"あごひもも確実に締めます。",t:"工事用安全帽は×。"},
{k:1,c:"二輪車の運転",a:false,q:"工事用の安全帽でも、あごひもを確実に締めれば、二輪車の乗車用ヘルメットとして使うことができる。",e:"乗車用ヘルメットを使います。工事用安全帽は乗車用ヘルメットではありません。",t:"「あごひもを締めれば」という条件づけのひっかけ。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車に乗るときは、夏でも長袖・長ズボンを着用し、できるだけ肌の露出を少なくする。",e:"転倒したときのけがを軽くします。",t:"「夏は半袖でよい」は×。"},
{k:1,c:"二輪車の運転",a:true,q:"エンジンを止めた二輪車を押して歩くときは、歩行者として扱われる（側車付きのものや、他の車をけん引しているものを除く）。",e:"道路交通法第2条第3項により歩行者として扱われ、歩道を通行できます。",t:"歩行者扱いにならないのは「側車付き」と「他の車をけん引している」場合。"},
{k:1,c:"二輪車の運転",a:false,q:"エンジンを止めた二輪車を押して歩くときでも、歩道を通行してはならない。",e:"エンジンを止めて押して歩く二輪車は歩行者として扱われるので、歩道を通行できます。",t:"歩行者扱いになることを問う問題。"},
{k:1,c:"二輪車の運転",a:true,q:"ぬかるみや砂利道では、低速ギアを使い、スロットルで速度を一定に保って通過する。",e:"急なスロットル操作やブレーキはタイヤを滑らせます。",t:"悪路は「スロットルで一定」。カーブの途中の「スロットルで加減」と区別する。"},
{k:1,c:"二輪車の運転",a:false,q:"砂利道では、高速ギアで勢いをつけて一気に通過するとよい。",e:"低速ギアで速度を一定に保ちながら通過します。",t:"「勢いをつけて」は×。"},
{k:1,c:"二輪車の運転",a:true,q:"二輪車で進路を変えるときは、ミラーだけでなく、直接目で後方の安全を確かめる。",e:"ミラーには死角があります。",t:"四輪車と同じく目視が必要。"},
{k:1,c:"二輪車の運転",a:false,q:"二輪車は車体が小さいので、渋滞している車の間をぬって走ってもよい。",e:"車の間をぬって走ったり、ジグザグ運転をしたりしてはいけません。",t:"「小さいから」はもっともらしい理由づけ。"},
{k:1,c:"二輪車の運転",a:true,q:"大型自動二輪車と普通自動二輪車の積み荷の高さは、地上から2メートル以下にしなければならない。",e:"道路交通法施行令で定められています。",t:"普通自動車3.8m、軽・三輪2.5m、二輪2mを区別。"},
{k:1,c:"二輪車の運転",a:true,q:"総排気量400ccを超える二輪車を運転するには、大型二輪免許が必要である。",e:"普通二輪免許で運転できるのは400cc以下です。",t:"排気量で区分を問う問題。"},
{k:1,c:"二輪車の運転",a:false,q:"総排気量400ccを超える二輪車は、普通二輪免許で運転することができる。",e:"400ccを超える二輪車には大型二輪免許が必要です。",t:"「以下」と「超える」の取り違え。"},
// ---------- はみ出し・表現の言い換え ----------
{k:1,c:"標識・標示",a:true,q:"「右側通行」の標示は、車が道路の右側部分にはみ出して通行することができることを示している。",e:"はみ出して通行してもよいことを示すもので、はみ出しを義務づけるものではありません。",t:"「できる」と「しなければならない」の違い。"},
{k:1,c:"標識・標示",a:false,q:"「右側通行」の標示のある場所では、対向車がいないときは、必ず道路の右側部分にはみ出して通行しなければならない。",e:"「右側通行」の標示は、はみ出して通行「できる」ことを示すもので、義務ではありません。",t:"「必ず」がひっかけ。"},
{k:1,c:"標識・標示",a:false,q:"「追越しのための右側部分はみ出し通行禁止」の区間でも、対向車がいなければ、はみ出して追い越しをしてもよい。",e:"対向車の有無に関係なく、追い越しのためのはみ出しは禁止されています。",t:"「対向車がいなければ」という条件づけのひっかけ。"},
{k:1,h:1,c:"追い越し・行き違い",a:false,q:"中央線が白の破線の道路で追い越しをするときは、必ず道路の右側部分にはみ出さなければならない。",e:"白の破線ははみ出しを「認めている」だけです。はみ出さずに追い越せるなら、はみ出す必要はありません。",t:"「してもよい」を「しなければならない」に変えたひっかけ。"},

  let s = `<clipPath id="zc${color.slice(1)}"><polygon points="40,40 160,40 160,80 40,80"/></clipPath><g clip-path="url(#zc${color.slice(1)})">`;

const BANK_TF = TF.map((q,i)=>({id:"t"+i,kind:"tf",cat:q[0],ans:q[1],q:q[2],exp:q[3],sign:q[4]||null,trap:TRAP[i]||"",hard:false}))
  .concat(EXTRA.map((x,i)=>({id:"x"+i,kind:"tf",cat:x.c,ans:x.a,q:x.q,exp:x.e,sign:x.s||null,trap:x.t||"",hard:!!x.h,list:!!x.l,kouka:!!x.k})));
const BANK_KK = KIKEN.map((k,i)=>({id:"k"+i,kind:"kk",cat:"危険予測",s:k.s,tip:KK_TIP[i]||"",items:k.items.map(x=>({ans:x[0],q:x[1],exp:x[2]}))}));

/* ===== ストレージ ===== */
const KEY = "gakkaQuiz.tokyo.v2";
let store = {stats:{}, custom:[], settings:{}};
try{ const s = localStorage.getItem(KEY); if(s) store = Object.assign(store, JSON.parse(s)); }catch(e){}
store.settings = Object.assign({answerMode:"instant", timeLimit:false, includeHard:false}, store.settings||{});
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

function tfEvery(){ return BANK_TF.concat(store.custom.map(c=>Object.assign({kind:"tf",sign:null,trap:"",hard:false},c))); }
function tfAll(){ return store.settings.includeHard ? tfEvery() : tfEvery().filter(q=>!q.hard); }
function hardAll(){ return tfEvery().filter(q=>q.hard); }
function everything(){ return tfAll().concat(BANK_KK); }
function stat(id){ return store.stats[id] || {c:0,w:0,last:null}; }
function isWeak(id){ const s = stat(id); return s.w>0 && s.last===false; }

/* ===== 共通 ===== */
const app = document.getElementById("app");
let S = null, timerId = null;
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(t){ return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ox(v){ return v===true?"○":v===false?"×":"―"; }
function isCorrect(q,a){
  if(q.kind==="kk") return Array.isArray(a) && q.items.every((it,j)=>a[j]===it.ans);
  return a===q.ans;
}
function points(q){ return q.kind==="kk" ? 2 : 1; }
function answered(q,a){ return q.kind==="kk" ? Array.isArray(a) && a.every(v=>v===true||v===false) : (a===true||a===false); }
function record(q,ok){ const s=stat(q.id); if(ok) s.c++; else s.w++; s.last=ok; store.stats[q.id]=s; }

/* 解説ブロック（正解のポイント＋ひっかけポイント） */
function explainTF(q){
  return `<div class="exp"><div class="lbl">正解のポイント</div>${esc(q.exp||"（解説なし）")}</div>
    ${q.trap?`<div class="exp trap"><div class="lbl">ひっかけポイント</div>${esc(q.trap)}</div>`:""}`;
}
function explainKKTip(q){
  return q.tip?`<div class="exp trap"><div class="lbl">考え方のコツ</div>${esc(q.tip)}</div>`:"";
}

function setMode(m){ store.settings.answerMode=m; save(); home(); }
function setTimeLimit(v){ store.settings.timeLimit=v; save(); }

/* ===== 出題開始 =====
   S.mode: "instant"（すぐ答えがわかる） / "batch"（全問解答） / "mock"（模擬試験＝全問解答＋合否） */
function blankAns(list){ return list.map(q=>q.kind==="kk"?[null,null,null]:null); }
function startSet(list,title){
  if(!list.length) return;
  const mode = store.settings.answerMode==="batch" ? "batch" : "instant";
  S = {mode, title, list, i:0, ans:blankAns(list), checked:list.map(()=>false), start:Date.now()};
  render(); startTimer();
}
function startMock(type){
  let list, minutes, pass, title;
  if(type==="honmen"){
    list = shuffle(tfAll()).slice(0,90).concat(shuffle(BANK_KK).slice(0,5));
    minutes=50; pass=90; title="本免学科 模擬試験";
  }else{
    list = shuffle(tfAll()).slice(0,50); minutes=30; pass=45; title="仮免学科 模擬試験";
  }
  const total = list.reduce((s,q)=>s+points(q),0);
  S = {mode:"mock", title, list, i:0, ans:blankAns(list), start:Date.now(),
       end: store.settings.timeLimit ? Date.now()+minutes*60000 : null, pass, total};
  render(); startTimer();
}
const isBatch = ()=> S.mode==="batch" || S.mode==="mock";

/* ===== 描画 ===== */

            <button class="mini x ${a[j]===false?"sel":""}" ${done?"disabled":""} onclick="setKK(${j},false)">×</button>
          </div>
          ${done?`<div class="kkfb ${a[j]===it.ans?"ok":"ng"}"><b>${a[j]===it.ans?"正解":"不正解"}</b>（正解は${ox(it.ans)}）${esc(it.exp)}</div>`:""}
        </div>`).join("")}
      ${done?`<div class="feedback ${isCorrect(q,a)?"ok":"ng"}"><b>${isCorrect(q,a)?"3つとも正解（2点）":"不正解（0点）"}</b></div>${explainKKTip(q)}`:""}
      ${S.mode==="instant"&&!done?`<button class="btn center" ${answered(q,a)?"":"disabled"} onclick="checkKK()">答え合わせ</button>`:""}`;
  }
  const unans = isBatch() ? S.list.filter((qq,k)=>!answered(qq,S.ans[k])).length : 0;
  app.innerHTML = `
    <div class="topbar"><button class="link" onclick="quit()">← やめる</button>
      <span>${esc(S.title)}　${S.i+1} / ${n}</span><span id="timer"></span></div>
    <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
    <div class="card">${body}</div>
    ${isBatch() ? `
      <div class="row">
        <button class="btn ghost center" ${S.i?"":"disabled"} onclick="go(S.i-1)">前へ</button>
        <button class="btn ghost center" ${S.i<n-1?"":"disabled"} onclick="go(S.i+1)">次へ</button>
      </div>
      <button class="btn center" onclick="finishConfirm()">採点する（未回答 ${unans}問）</button>
      <details class="card"><summary>問題一覧から移動</summary><div class="grid">
        ${S.list.map((qq,k)=>`<button class="cell ${answered(qq,S.ans[k])?"filled":""} ${k===S.i?"cur":""}" onclick="go(${k})">${k+1}</button>`).join("")}
      </div></details>` : ""}
    ${done ? `<button class="btn center" onclick="next()">${S.i<n-1?"次の問題":"結果を見る"}</button>` : ""}
  `;
  tick();
}

/* ===== 操作 ===== */
function answerTF(v){
  const q = S.list[S.i]; S.ans[S.i]=v;
  if(S.mode==="instant"){ S.checked[S.i]=true; record(q,v===q.ans); save(); render(); }
  else{ if(S.i<S.list.length-1) S.i++; render(); }
}
function setKK(j,v){ S.ans[S.i][j]=v; render(); }
function checkKK(){ const q=S.list[S.i]; S.checked[S.i]=true; record(q,isCorrect(q,S.ans[S.i])); save(); render(); }
function go(k){ S.i=Math.max(0,Math.min(S.list.length-1,k)); render(); window.scrollTo(0,0); }
function next(){ if(S.i<S.list.length-1){ S.i++; render(); window.scrollTo(0,0);} else result(); }
function finishConfirm(){
  const un = S.list.filter((q,k)=>!answered(q,S.ans[k])).length;
  if(un && !confirm(`未回答が${un}問あります。採点しますか？`)) return;
  finishBatch();
}
function finishBatch(){
  stopTimer();
  S.list.forEach((q,k)=>record(q,isCorrect(q,S.ans[k])));
  save(); result();
}
function quit(){
  if(S && isBatch() && !confirm("中断しますか？（この回の成績は記録されません）")) return;
  if(S && S.mode==="instant" && S.checked.some(Boolean) && confirm("ここまでの結果を表示しますか？")) { result(); return; }
  home();
}

/* ===== 結果 ===== */
let resultFilter = "wrong";
function result(){
  stopTimer();
  S.elapsed = S.elapsed || Date.now()-S.start;
  const rows = S.list.map((q,k)=>({q,a:S.ans[k],ok:isCorrect(q,S.ans[k]),no:k+1}));
  const done = S.mode==="instant" ? rows.filter((r,k)=>S.checked[k]) : rows;
  const score = done.reduce((s,r)=>s+(r.ok?points(r.q):0),0);
  const total = S.mode==="mock" ? S.total : done.reduce((s,r)=>s+points(r.q),0);
  const wrong = done.filter(r=>!r.ok);
  const pass = S.mode==="mock" ? score>=S.pass : null;
  const kkRows = done.filter(r=>r.q.kind==="kk");
  const shown = resultFilter==="all" ? done : wrong;
  const mins = Math.floor(S.elapsed/60000), secs = Math.floor(S.elapsed%60000/1000);
  app.innerHTML = `
    <div class="topbar"><button class="link" onclick="home()">← ホーム</button><span>${esc(S.title)}</span><span></span></div>
    <div class="card center">
      <div class="big ${pass===null?"":pass?"pass":"fail"}">${score} / ${total}${S.mode==="mock"?"点":""}</div>
      <div>${pass===null?`正答率 ${total?Math.round(score/total*100):0}%`:pass?"合格ライン到達！":`不合格（合格は${S.pass}点以上）`}</div>
      ${kkRows.length&&S.mode==="mock"?`<div class="sub">文章問題 ${done.filter(r=>r.q.kind==="tf"&&r.ok).length}/${done.filter(r=>r.q.kind==="tf").length}問・危険予測 ${kkRows.filter(r=>r.ok).length}/${kkRows.length}題</div>`:""}
      <div class="sub">所要時間 ${mins}分${String(secs).padStart(2,"0")}秒</div>
    </div>
    ${wrong.length?`<button class="btn center" id="retry">間違えた${wrong.length}問をもう一度</button>`:""}
    <div class="seg small">
      <button class="${resultFilter==="wrong"?"on":""}" onclick="resultFilter='wrong';result()">間違えた問題（${wrong.length}）</button>
      <button class="${resultFilter==="all"?"on":""}" onclick="resultFilter='all';result()">全問の解説（${done.length}）</button>
    </div>
    <div class="card">${shown.map(reviewRow).join("") || "<div class='sub'>間違いはありません。全問正解です！</div>"}</div>
    <button class="btn ghost center" onclick="home()">ホームへ戻る</button>
  `;
  const rb = document.getElementById("retry");
  if(rb) rb.onclick = ()=>{ resultFilter="wrong"; startSet(shuffle(wrong.map(r=>r.q)),"間違えた問題"); };
}
function reviewRow(r){
  const q=r.q;
  if(q.kind==="tf") return `
    <div class="review"><div class="rhead"><span class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✗"}</span> <span class="sub">${r.no}.</span> <span class="qcat">${esc(q.cat)}</span>${q.hard?` <span class="qcat hard">意地悪</span>`:""}</div>
      ${q.sign?`<div class="sign small">${SIGNS[q.sign]}</div>`:""}
      <div>${esc(q.q)}</div>
      <div class="mark">正解：<span class="${q.ans?"pass":"fail"}">${ox(q.ans)}</span>　<span class="sub">あなた：${r.a===null?"未回答":ox(r.a)}</span></div>
      ${explainTF(q)}</div>`;
  return `
    <div class="review"><div class="rhead"><span class="${r.ok?"pass":"fail"}">${r.ok?"✓":"✗"}</span> <span class="sub">${r.no}.</span> <span class="qcat">危険予測</span></div>
      <div>${esc(q.s)}</div>
      ${q.items.map((it,j)=>`<div class="kkrev"><span class="${r.a[j]===it.ans?"pass":"fail"}">${r.a[j]===it.ans?"✓":"✗"}</span> (${j+1}) ${esc(it.q)}<br><span class="sub">正解：${ox(it.ans)}／あなた：${ox(r.a[j])}　${esc(it.exp)}</span></div>`).join("")}
      ${explainKKTip(q)}
    </div>`;
}

/* ===== タイマー（制限時間なしのときは経過時間を表示） ===== */
function startTimer(){ stopTimer(); timerId=setInterval(tick,1000); }
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }
function fmt(ms){ const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return `${m}:${String(s).padStart(2,"0")}`; }
function tick(){
  const el = document.getElementById("timer");
  if(!el || !S) return;
  if(S.end){
    const left = Math.max(0, S.end-Date.now());
    el.textContent = `残り ${fmt(left)}`;
    el.className = left<5*60000 ? "warn" : "";
    if(left<=0){ stopTimer(); alert("時間切れです。採点します。"); finishBatch(); }
  }else{
    el.textContent = `経過 ${fmt(Date.now()-S.start)}`;
  }
}

/* ===== 問題追加・リセット ===== */
function importQ(){
  const lines = document.getElementById("imp").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  let added=0, bad=0;
  lines.forEach((l,k)=>{
    const p = l.split(/[|｜]/);
    const m = (p[0]||"").trim();
    const ans = /^(○|〇|◯|o|O|true|1)$/.test(m) ? true : /^(×|✕|x|X|false|0)$/.test(m) ? false : null;
    if(ans===null || !p[1] || !p[1].trim()){ bad++; return; }
    store.custom.push({id:"u"+Date.now()+"_"+k, cat:"追加問題", ans, q:p[1].trim(), exp:(p.slice(2).join("|")||"").trim()});
    added++;
  });
  save(); home();
  document.getElementById("impMsg").textContent = `${added}問追加しました${bad?`（読み込めなかった行：${bad}）`:""}。追加済み：${store.custom.length}問`;
}
function clearCustom(){ if(confirm("追加した問題をすべて削除しますか？")){ store.custom=[]; save(); home(); } }
function resetStats(){ if(confirm("成績をすべてリセットしますか？")){ store.stats={}; save(); home(); } }

home();

</script>
